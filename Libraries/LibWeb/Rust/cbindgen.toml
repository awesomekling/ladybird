    "CssComponentValueKind",
    "CssContainValue",
    "CssContainValueKind",
    "CssContainerTypeValueKind",
    "CssCounterStyleKind",
    "CssCounterStyleNegativeSymbolCount",
    "CssCounterStyleRangeKind",
    "CssCounterStyleSymbolsType",
    "CssCounterStyleSystemKind",
    "CssCropOrCrossKind",
    "CssDeclaration",
    "CssDescriptorResultKind",
    "CssDescriptorSyntaxKind",
    "CssDescriptorValueType",
    "CssFontFamilyValueKind",
    "CssFontLanguageOverrideKind",
    "CssFontSourceKind",
    "CssFontStyleKind",
    "CssFontVariantAlternatesValueKind",
    "CssFontVariantEastAsianValueKind",
