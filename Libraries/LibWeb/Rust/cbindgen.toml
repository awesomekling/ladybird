    "CssMediaFeatureValueKind",
    "CssMediaFeatureValueSyntaxKind",
    "CssMediaQuery",
    "CssNonnegativeIntegerSymbolPairOrder",
    "CssNumberType",
    "CssOpenTypeSettingsKind",
