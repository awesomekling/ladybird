<!doctype html>
<html class="reftest-wait">
<style>
    body { font-family: sans-serif; }
    #font { width: 400px; }
</style>
<div id="font"><span>inherited font size</span></div>
<script>
    const animation = document.getElementById("font").animate({ fontSize: ["10px", "30px"] }, { duration: 1000, fill: "both" });
    animation.pause();
    animation.currentTime = 250;
    requestAnimationFrame(() => {
        requestAnimationFrame(() => {
            animation.currentTime = 750;
            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    document.documentElement.classList.remove("reftest-wait");
                });
            });
        });
    });
</script>
</html>
