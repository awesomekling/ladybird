<!DOCTYPE html>
<script src="../include.js"></script>
<script src="_helpers.js"></script>
<style>
    .anchor:has(.match) { color: rgb(255, 0, 0); }
</style>
<!-- Element with .match starts outside any :has() anchor's scope.
     Moving it into the anchor must invalidate the anchor's :has() match. -->
<div id="source"><span class="match" id="movee">x</span></div>
<div class="anchor" id="anchor"></div>
<script>
    test(() => {
        println(`initial anchor color: ${getComputedStyle(document.getElementById("anchor")).color}`);
        settleAndReset();

        document.getElementById("anchor").appendChild(document.getElementById("movee"));
        println(`after move into anchor: ${getComputedStyle(document.getElementById("anchor")).color}`);
        printCounters("after move into anchor");

        internals.resetStyleInvalidationCounters();

        document.getElementById("source").appendChild(document.getElementById("movee"));
        println(`after move back out: ${getComputedStyle(document.getElementById("anchor")).color}`);
        printCounters("after move back out");
    });
</script>
