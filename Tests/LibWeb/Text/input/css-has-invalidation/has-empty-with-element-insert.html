<!DOCTYPE html>
<script src="../include.js"></script>
<script src="_helpers.js"></script>
<style>
    .anchor:has(:empty) { color: rgb(255, 0, 0); }
</style>
<!-- Anchor matches initially because target is :empty. We toggle target's
     emptiness by inserting/removing an element child (not text). -->
<div class="anchor" id="anchor">
    <div id="target"></div>
</div>
<script>
    test(() => {
        println(`initial color: ${getComputedStyle(document.getElementById("anchor")).color}`);
        settleAndReset();

        const child = document.createElement("span");
        document.getElementById("target").appendChild(child);
        println(`after element insert: ${getComputedStyle(document.getElementById("anchor")).color}`);
        printCounters("after element insert into empty target");

        internals.resetStyleInvalidationCounters();

        child.remove();
        println(`after element remove: ${getComputedStyle(document.getElementById("anchor")).color}`);
        printCounters("after element remove from target");
    });
</script>
