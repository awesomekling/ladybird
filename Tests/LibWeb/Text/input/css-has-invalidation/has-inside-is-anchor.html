<!DOCTYPE html>
<script src="../include.js"></script>
<script src="_helpers.js"></script>
<style>
    /* :has() wrapped in :is() in the anchor compound. Should still flow through
       invalidation correctly. */
    body:is(:has(.flag)) .target {
        background-color: rgb(0, 0, 255);
    }
</style>
<div id="probe"></div>
<p class="target">target</p>
<script>
    test(() => {
        println(`initial bg: ${getComputedStyle(document.querySelector(".target")).backgroundColor}`);
        settleAndReset();

        document.getElementById("probe").classList.add("flag");
        println(`after add .flag: ${getComputedStyle(document.querySelector(".target")).backgroundColor}`);
        printCounters("after add .flag");

        internals.resetStyleInvalidationCounters();

        document.getElementById("probe").classList.remove("flag");
        println(`after remove .flag: ${getComputedStyle(document.querySelector(".target")).backgroundColor}`);
        printCounters("after remove .flag");
    });
</script>
