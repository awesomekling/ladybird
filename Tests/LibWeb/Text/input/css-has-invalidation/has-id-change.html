<!DOCTYPE html>
<script src="../include.js"></script>
<script src="_helpers.js"></script>
<style>
    .anchor:has(#target) { color: rgb(255, 0, 0); }
</style>
<div class="anchor" id="anchor">
    <span id="other">x</span>
</div>
<script>
    test(() => {
        println(`initial color: ${getComputedStyle(document.getElementById("anchor")).color}`);
        settleAndReset();

        document.getElementById("other").id = "target";
        println(`after id rename to 'target': ${getComputedStyle(document.getElementById("anchor")).color}`);
        printCounters("after id rename to 'target'");

        internals.resetStyleInvalidationCounters();

        document.getElementById("target").id = "other";
        println(`after id rename to 'other': ${getComputedStyle(document.getElementById("anchor")).color}`);
        printCounters("after id rename back to 'other'");
    });
</script>
