<!DOCTYPE html>
<style>
    #rev { counter-reset: reversed(r); }
    #rev > div { counter-increment: r 2; }
    #rev > div.five { counter-increment: r 5; }
    #rev > div::before { content: counter(r) " "; }
    #rev > div > i { counter-increment: r -1; }
</style>
<div id="root"><ol id="list" reversed></ol><div id="rev"></div></div>
<script src="../include.js"></script>
<script src="resources/parallel-scale.js"></script>
<script>
    // A reversed list and a reversed CSS counter, each with a long child list planned in runs. The counter's start
    // value counts every increment of its scope, some of them below the children, up to a counter-set.
    const list = document.getElementById("list");
    list.innerHTML = repeatMarkup(700, item => `<li><span><b>${item}</b></span><b>b</b></li>`);
    const rev = document.getElementById("rev");
    rev.innerHTML = repeatMarkup(700, index => {
        const five = index % 9 === 4 ? ' class="five"' : "";
        const set = index === 480 ? ' style="counter-set: r 77"' : "";
        const inner = index % 23 === 11 ? "<i></i>" : "";
        return `<div${five}${set}><span><b>${index}</b></span>${inner}</div>`;
    });

    function printGeneratedTexts(parent) {
        const children = [...parent.children];
        for (let start = 0; start < children.length; start += 50) {
            const texts = children.slice(start, start + 50).map(child => summarizeLayoutSubtree(child).text);
            println(`${parent.id} ${start}: ${texts.join("|")}`);
        }
    }

    test(() => {
        printGeneratedTexts(list);
        printGeneratedTexts(rev);
        runSequentialFullRebuildComparisons([
            ["remove an item of the reversed list", () => list.children[350].remove()],
            ["remove the counter-set", () => rev.children[480].removeAttribute("style")],
        ]);
        printGeneratedTexts(list);
        printGeneratedTexts(rev);
    });
</script>
