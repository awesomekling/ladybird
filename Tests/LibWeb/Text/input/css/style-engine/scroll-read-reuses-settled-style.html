<!DOCTYPE html>
<script src="../../include.js"></script>
<style>
    #scroller { overflow: hidden; width: 100px; height: 100px; }
    #content { width: 300px; height: 300px; }
    #scroller.paint-only { background-color: red; }
</style>
<div id="scroller"><div id="content"></div></div>
<script>
    test(() => {
        const scroller = document.getElementById("scroller");
        const content = document.getElementById("content");
        const results = [];
        scroller.scroll(40, 50);
        internals.resetStyleInvalidationCounters();
        for (let index = 0; index < 100; ++index) {
            scroller.scrollTop;
            scroller.scrollLeft;
        }
        results.push(`clean reads skip style updates: ${internals.getStyleInvalidationCounters().styleStabilizationEpochs === 0}`);
        scroller.classList.add("paint-only");
        results.push(`paint-only offsets: ${scroller.scrollTop},${scroller.scrollLeft}`);
        results.push(`pending style settled: ${internals.getStyleInvalidationCounters().styleStabilizationEpochs > 0}`);
        results.push(`background is observable: ${getComputedStyle(scroller).backgroundColor}`);

        scroller.style.overflow = "visible";
        results.push(`not scrollable: ${scroller.scrollTop},${scroller.scrollLeft}`);
        scroller.style.removeProperty("overflow");
        results.push(`scrollable again: ${scroller.scrollTop},${scroller.scrollLeft}`);

        content.style.transform = "translateY(500px)";
        scroller.scrollTop = 10000;
        results.push(`transformed overflow: ${scroller.scrollTop}`);
        content.style.transform = "translateY(150px)";
        getComputedStyle(content).transform;
        results.push(`overflow-only clamp: ${scroller.scrollTop}`);
        content.style.cssText = "width: 50px; height: 50px;";
        results.push(`layout clamp: ${scroller.scrollTop},${scroller.scrollLeft}`);

        scroller.style.display = "none";
        results.push(`hidden offsets: ${scroller.scrollTop},${scroller.scrollLeft}`);
        scroller.style.removeProperty("display");
        results.push(`restored offsets: ${scroller.scrollTop},${scroller.scrollLeft}`);
        scroller.remove();
        results.push(`detached offsets: ${scroller.scrollTop},${scroller.scrollLeft}`);
        results.forEach(println);
    });
</script>
