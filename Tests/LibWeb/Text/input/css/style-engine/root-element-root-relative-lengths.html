<!DOCTYPE html>
<html>
<script src="../../include.js"></script>
<style>
    html { padding: 1rem; margin: 2em; }
    html.big { font-size: 24px; }
</style>
<body>
<script>
    // `rem` on the document element names the document element's own computed font-size, and
    // `em` names it too, so both move in the same computation that moves the font size.
    test(() => {
        const counters = () => Object.assign({}, internals.styleEngineCounters(), internals.getStyleInvalidationCounters());
        let before = counters();
        // NB: The first style update can run before this test does, so only the class flips, which
        //     happen while the counters are being watched, say who settled the record.
        const report = (label, sayWhoSettledIt) => {
            internals.updateStyle();
            const after = counters();
            const engineRecords = (after.engineComputedRecordDeltas ?? 0) - (before.engineComputedRecordDeltas ?? 0);
            const style = getComputedStyle(document.documentElement);
            println(`${label}: font-size ${style.fontSize}, padding ${style.paddingTop}, margin ${style.marginTop}`);
            if (sayWhoSettledIt)
                println(`    settled by the engine ${engineRecords > 0}`);
            before = after;
        };
        report("initial", false);
        document.documentElement.className = "big";
        report("html.big", true);
        document.documentElement.className = "";
        report("html.none", true);
    });
</script>
</body>
</html>
