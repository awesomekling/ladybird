<!DOCTYPE html>
<script src="../../include.js"></script>
<style>
    div > div { color: blue; }
    li::marker { color: green; }
</style>
<ul><li id="item">item</li></ul>
<div id="container"></div>
<script>
    container.innerHTML = "<div></div>".repeat(100);
</script>
<script>
    test(() => {
        const rows = () => {
            document.body.classList.toggle("flip");
            internals.updateStyle();
            return internals.styleEngineCounters().cascadePseudoWinnerRows;
        };
        const before = rows();
        container.appendChild(document.createElement("div"));
        internals.updateStyle();
        container.firstElementChild.remove();
        internals.updateStyle();
        // NB: Whether the untouched siblings hold rows yet depends on how their style passes were
        //     split, so only the bound is stable: a leaf insert must not add rows per sibling.
        const added = rows() - before;
        println(`pseudo-element winner rows added: ${added < container.childElementCount ? "fewer than siblings" : added}`);
        println(`marker color: ${getComputedStyle(item, "::marker").color}`);
    });
</script>
