<!DOCTYPE html>
<script src="../../include.js"></script>
<span id="before" class="shown"></span>
<span id="after" class="shown-too"></span>
<style>
    .shown { color: red }
    .late { color: green }
    .late-too { color: red }
    .shown-too { color: green }
    .arrives { color: green }
    #named > .child { width: 50px }
    .never-used { color: red }
    .awake .sleeper { color: green }
    @layer low { .reverting { margin-left: 7px } .awake .reverting { margin-left: 9px } }
    @layer top { .reverting { margin-left: var(--missing, revert-layer) } }
    .awake ~ .sibling { color: green }
</style>
<div id="ancestor"><span class="sleeper"></span><span class="reverting"></span></div>
<div id="before"></div><span class="sibling"></span>
<div id="root"></div>
<script>
    test(() => {
        internals.updateStyle();
        const before = internals.styleEngineCounters();
        const root = document.getElementById("root");

        // Nothing carried these keys when the sheet arrived. The element that first does wakes its rule.
        const arrives = document.createElement("span");
        arrives.className = "arrives";
        root.append(arrives);
        println(`an arriving element: ${getComputedStyle(arrives).color}`);

        // A rule that wakes takes its place in the cascade among the rules that were compiled at once.
        document.getElementById("before").classList.add("late");
        document.getElementById("after").classList.add("late-too");
        println(`a later woken rule wins: ${getComputedStyle(document.getElementById("before")).color}`);
        println(`an earlier woken rule loses: ${getComputedStyle(document.getElementById("after")).color}`);

        // A woken rule that moves geometry reaches a layout query.
        const parent = document.createElement("div");
        parent.id = "named";
        const child = document.createElement("div");
        child.className = "child";
        parent.append(child);
        root.append(parent);
        println(`a woken rule moves geometry: ${child.offsetWidth}`);

        const after = internals.styleEngineCounters();
        println(`rules woken: ${after.styleRulesWoken - before.styleRulesWoken}`);

        // A rule whose selector needs an ancestor's class waits for that class, though its subjects are there.
        const ancestor = document.getElementById("ancestor");
        const sleeper = ancestor.querySelector(".sleeper");
        const reverting = ancestor.querySelector(".reverting");
        const sibling = document.querySelector(".sibling");
        const relation = () =>
            `${getComputedStyle(sleeper).color} ${getComputedStyle(reverting).marginLeft} ${getComputedStyle(sibling).color}`;
        println(`before the ancestor's class: ${relation()}`);
        ancestor.classList.add("awake");
        document.getElementById("before").classList.add("awake");
        println(`the ancestor's class added: ${relation()}`);
        ancestor.classList.remove("awake");
        document.getElementById("before").classList.remove("awake");
        println(`the ancestor's class removed: ${relation()}`);
    });
</script>
