<!DOCTYPE html>
<script src="../../include.js"></script>
<style>
    @counter-style marker { system: cyclic; symbols: "A"; }
    #container > div {
        display: list-item;
        list-style: marker inside;
        width: max-content;
    }
</style>
<div id="container"></div>
<script>
    test(() => {
        internals.updateStyle();
        const initialCounters = internals.getStyleInvalidationCounters();
        for (let index = 0; index < 16; ++index)
            container.appendChild(document.createElement("div"));
        const targets = [...container.children];
        const initialWidths = targets.map(target => target.getBoundingClientRect().width);
        const settledCounters = internals.getStyleInvalidationCounters();
        println(`initial consumers answered by engine: ${settledCounters.engineComputedStyleRecords - initialCounters.engineComputedStyleRecords >= targets.length}`);
        println(`initial C++ recomputations: ${settledCounters.elementStyleRecomputations - initialCounters.elementStyleRecomputations}`);
        const beforeMutation = internals.getStyleInvalidationCounters();
        document.styleSheets[0].cssRules[0].symbols = '"BBBBBBBB"';
        println(`all shared consumers update: ${targets.every((target, index) => target.getBoundingClientRect().width > initialWidths[index])}`);
        const afterMutation = internals.getStyleInvalidationCounters();
        println(`counter-style consumers answered by engine: ${afterMutation.engineComputedStyleRecords - beforeMutation.engineComputedStyleRecords >= targets.length && afterMutation.elementStyleRecomputations === beforeMutation.elementStyleRecomputations}`);
        document.styleSheets[0].cssRules[0].symbols = '"A"';
        println(`all shared consumers restore: ${targets.every((target, index) => target.getBoundingClientRect().width === initialWidths[index])}`);
    });
</script>
