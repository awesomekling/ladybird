<!DOCTYPE html>
<script src="../../include.js"></script>
<script>
    // Adopting a shadow root that defines @keyframes into another document gives up its keyframes row
    // in the engine of the document it leaves, and publishes them in the engine of the one it joins.
    // Each document's first shadow root has the same tree scope number in its own engine: giving the
    // row up in the wrong engine would drop the other document's root's keyframes and leave the old
    // document's row behind.
    asyncTest(async done => {
        const iframe = document.createElement("iframe");
        const loaded = new Promise(resolve => iframe.addEventListener("load", resolve, { once: true }));
        document.body.appendChild(iframe);
        await loaded;
        const child = iframe.contentWindow;

        function attach(doc, name, opacity) {
            const host = doc.createElement("div");
            const root = host.attachShadow({ mode: "open" });
            root.innerHTML = `
                <style>
                    @keyframes ${name} {
                        from { opacity: ${opacity}; }
                        to { opacity: ${opacity}; }
                    }
                    #target.go { animation: ${name} 100s linear; }
                </style>
                <div id="target"></div>`;
            doc.body.appendChild(host);
            return { host, target: root.getElementById("target") };
        }

        const moved = attach(document, "spin", 0.25);
        const stays = attach(child.document, "fade", 0.5);
        internals.updateStyle();
        child.internals.updateStyle();
        const scopes = () => [
            internals.styleEngineCounters().animationKeyframeScopes,
            child.internals.styleEngineCounters().animationKeyframeScopes,
        ];
        const [oldBefore, newBefore] = scopes();

        child.document.body.appendChild(child.document.adoptNode(moved.host));
        child.internals.updateStyle();
        internals.updateStyle();
        const [oldAfter, newAfter] = scopes();
        println(`old document scopes: ${oldBefore} -> ${oldAfter}`);
        println(`new document scopes: ${newBefore} -> ${newAfter}`);

        stays.target.classList.add("go");
        moved.target.classList.add("go");
        println(`staying root's animation: ${child.getComputedStyle(stays.target).opacity}`);
        println(`adopted root's animation: ${child.getComputedStyle(moved.target).opacity}`);
        done();
    });
</script>
