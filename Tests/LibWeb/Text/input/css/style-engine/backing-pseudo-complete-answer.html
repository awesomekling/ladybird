<!DOCTYPE html>
<script src="../../include.js"></script>
<style>
    input::placeholder { color: red; }
    input.changed::placeholder { color: green; }
</style>
<input id="input" placeholder="text">
<script>
    test(() => {
        internals.updateStyle();
        const before = internals.styleEngineCounters().engineComputedRecordHostPseudoBackings;
        input.classList.add("changed");
        internals.updateStyle();
        const after = internals.styleEngineCounters().engineComputedRecordHostPseudoBackings;
        println(`backing pseudo settled by engine: ${after > before}`);
        println(`placeholder color: ${getComputedStyle(input, "::placeholder").color}`);
    });
</script>
