<!DOCTYPE html>
<script src="../../include.js"></script>
<style>
    .sel::selection { color: rgb(1, 2, 3); background-color: rgb(4, 5, 6); }
    .moved { color: rgb(0, 128, 0); }
</style>
<p id="plain">plain text</p>
<p id="styled" class="sel">styled <span id="inner">inner</span> text</p>
<script>
    // Once a selection makes ::selection styles observable, every element in the selection is
    // told its pseudo-element inputs may have changed. The engine answers for the elements
    // themselves, and the highlight pseudo-elements are recomputed as each record installs. An
    // unrelated change in the same update keeps the transaction from being one of pseudo-element
    // inputs alone, which C++ refreshes itself.
    test(() => {
        internals.updateStyle();
        const before = internals.getStyleInvalidationCounters().engineComputedStyleRecords;
        getSelection().selectAllChildren(document.body);
        document.getElementById("plain").classList.add("moved");
        internals.updateStyle();
        const computed = internals.getStyleInvalidationCounters().engineComputedStyleRecords - before;
        println(`engine computed records: ${computed > 0}`);
        const styled = getComputedStyle(document.getElementById("styled"), "::selection");
        println(`styled ::selection: ${styled.color} on ${styled.backgroundColor}`);
        const inner = getComputedStyle(document.getElementById("inner"), "::selection");
        println(`inner ::selection inherits: ${inner.color} on ${inner.backgroundColor}`);
        println(`plain color: ${getComputedStyle(document.getElementById("plain")).color}`);
    });
</script>
