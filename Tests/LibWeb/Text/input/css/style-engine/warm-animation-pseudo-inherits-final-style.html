<!DOCTYPE html>
<script src="../../include.js"></script>
<style>
    #target { color: red; }
    #target.changed { color: blue; }
    #target::before { content: "before"; color: inherit; }
</style>
<div id="target"></div>
<script>
    test(() => {
        internals.updateStyle();
        const animation = target.animate(
            { color: ["green", "green"] },
            { duration: 1000, fill: "both" },
        );
        animation.pause();
        animation.currentTime = 500;
        internals.updateStyle();

        const before = internals.getStyleInvalidationCounters();
        target.className = "changed";
        internals.updateStyle();
        const after = internals.getStyleInvalidationCounters();
        println(`warm host stayed in the engine: ${after.elementStyleRecomputations === before.elementStyleRecomputations}`);
        println(`animated host color: ${getComputedStyle(target).color}`);
        println(`pseudo inherits final color: ${getComputedStyle(target, "::before").color}`);
    });
</script>
