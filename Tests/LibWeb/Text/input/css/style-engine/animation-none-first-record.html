<!doctype html>
<script src="../../include.js"></script>
<style>
    @keyframes unrelated { from { color: red; } to { color: blue; } }
    .target { animation-name: none; animation-duration: 2s; }
</style>
<script>
    test(() => {
        internals.updateStyle();
        const before = internals.styleEngineCounters();
        const target = document.createElement("div");
        target.className = "target";
        document.body.append(target);
        internals.updateStyle();
        const after = internals.styleEngineCounters();
        println(`engine answered: ${after.engineComputedRecordDeltas > before.engineComputedRecordDeltas}`);
        println(`property refusals: ${after.engineComputedRecordBailProperty - before.engineComputedRecordBailProperty}`);
        println(`animation count: ${target.getAnimations().length}`);
    });
</script>
