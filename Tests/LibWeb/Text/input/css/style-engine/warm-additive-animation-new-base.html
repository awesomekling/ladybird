<!DOCTYPE html>
<script src="../../include.js"></script>
<style>
    #target { margin-left: 5px; }
    #target.changed { margin-left: 10px; }
</style>
<div id="target"></div>
<script>
    test(() => {
        internals.updateStyle();
        const animation = target.animate(
            { marginLeft: ["20px", "20px"] },
            { duration: 1000, composite: "add", fill: "both" },
        );
        animation.pause();
        animation.currentTime = 500;
        internals.updateStyle();

        const before = internals.getStyleInvalidationCounters();
        target.className = "changed";
        internals.updateStyle();
        const after = internals.getStyleInvalidationCounters();
        println(`new base composes additively: ${getComputedStyle(target).marginLeft}`);
        println(`warm restyle stayed in the engine: ${after.elementStyleRecomputations === before.elementStyleRecomputations}`);
    });
</script>
