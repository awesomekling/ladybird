<!DOCTYPE html>
<script src="../../include.js"></script>
<div id="target"></div>
<script>
    test(() => {
        const target = document.getElementById("target");
        // The element has a box before its animation starts, so the box names every overlay
        // record the animation samples.
        document.body.offsetWidth;
        const animation = target.animate(
            [{ transform: "translateX(0px)" }, { transform: "translateX(100px)" }],
            { duration: 1000, fill: "both" });
        animation.pause();
        animation.currentTime = 0;
        internals.updateStyle();
        document.body.offsetWidth;

        const before = internals.styleEngineCounters();
        for (let time = 100; time < 1000; time += 100) {
            animation.currentTime = time;
            internals.updateStyle();
            document.body.offsetWidth;
        }
        const sampled = internals.styleEngineCounters();

        // A sample's record is rewritten in place unless someone still holds the record before it, as a box does
        // until the sample reaches it: then the sample takes a slot of its own, and the one the box let go of is reused.
        const slotsAdded = sampled.animationOverlaySlotsAllocated - before.animationOverlaySlotsAllocated;
        println(`overlay slots added at most one per sample: ${slotsAdded <= 9}`);
        println(`overlay records updated: ${sampled.animationOverlayRecordsUpdated - before.animationOverlayRecordsUpdated}`);
        println(`live overlay records: ${sampled.liveAnimationOverlayRecords}`);
    });
</script>
