<!doctype html>
<style>
    .container {
        container-type: inline-size;
    }
    #narrow {
        width: 100px;
    }
    #wide {
        width: 300px;
    }
    .subject::selection {
        text-underline-offset: 10cqw;
    }
</style>
<div class="container" id="narrow"><div class="subject" id="narrowSubject">narrow</div></div>
<div class="container" id="wide"><div class="subject" id="wideSubject">wide</div></div>
<script src="../../include.js"></script>
<script>
    test(() => {
        const report = label => {
            for (const subject of [narrowSubject, wideSubject]) {
                println(`${label} ${subject.id}: ${getComputedStyle(subject, "::selection").textUnderlineOffset}`);
            }
        };
        document.body.offsetWidth;
        report("initial");
        narrow.style.width = "200px";
        document.body.offsetWidth;
        report("resized");
    });
</script>
