<!DOCTYPE html>
<script src="../../include.js"></script>
<style>
    #container { container-type: inline-size; width: 200px; }
    @container (min-width: 100px) {
        #dependent.active { color: rgb(1, 2, 3); }
    }
</style>
<div id="container"><span id="dependent"></span></div>
<script>
    test(() => {
        document.body.offsetWidth;
        const before = internals.getStyleInvalidationCounters();
        const beforeEngine = internals.styleEngineCounters();

        container.style.color = "red";
        dependent.classList.add("active");
        internals.updateStyle();

        const after = internals.getStyleInvalidationCounters();
        const afterEngine = internals.styleEngineCounters();
        println(`dependent color: ${getComputedStyle(dependent).color}`);
        println(`C++ recomputations: ${after.elementStyleRecomputations - before.elementStyleRecomputations}`);
        println(`container verdict bails: ${afterEngine.engineComputedRecordBailContainerVerdict - beforeEngine.engineComputedRecordBailContainerVerdict}`);
    });
</script>
