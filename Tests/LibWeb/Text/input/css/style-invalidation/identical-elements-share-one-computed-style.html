<!DOCTYPE html>
<meta charset="utf-8">
<script src="../../include.js"></script>
<script src="structural-matrix.js"></script>
<script>
    test(() => {
        const style = addStyle(document.head, `.leaf { ${MATCH_DECLARATION} }`);

        function sharedWhileAdding(build) {
            const box = makeElement("section");
            build(box);
            document.body.append(box);
            resetStyleCounters();
            internals.updateStyle();
            // A record the style engine settles is shared by the engine's own cold-record cache
            // rather than by the host's style sharing, so the bound below counts both. The bound
            // on an element with a declaration of its own stays the host's alone: the engine
            // shares a *record* between elements whose computed values agree, which two elements
            // declaring different custom properties still do, while the environments stay their
            // own - a different thing from one element taking another's style.
            const counters = Object.assign({}, internals.styleEngineCounters(), styleCounters());
            const shared = counters.elementStyleSharedComputations
                + (counters.engineComputedRecordSharedHits ?? 0)
                + (counters.engineComputedRecordCohortHits ?? 0);
            const sharedByTheHost = counters.elementStyleSharedComputations;
            const probe = readProbe(box.firstChild);
            box.remove();
            internals.updateStyle();
            return { shared, sharedByTheHost, probe };
        }

        // Ten siblings with the same rules, the same parent and nothing of their own to say: one of
        // them computes a style and the other nine take it. The bound is printed rather than the
        // count, since anything else the same pass recomputes may share as well.
        const alike = sharedWhileAdding(box => {
            for (let i = 0; i < 10; i++) box.appendChild(makeElement("div", { className: "leaf" }));
        });
        println(`PASS: alike siblings compute one style between them: ${alike.shared >= 9}`);
        assertEqual("the shared style is the matched one", alike.probe, MATCH);

        // Ten siblings whose own declarations all differ share nothing with each other, so the same
        // page adding the same number of elements stays below the bound above.
        const differing = sharedWhileAdding(box => {
            for (let i = 0; i < 10; i++)
                box.appendChild(makeElement("div", { className: "leaf", attributes: { style: `--i: ${i}` } }));
        });
        println(`PASS: an element's own declaration keeps its style its own: ${differing.sharedByTheHost < 9}`);
        assertEqual("an unshared style is still the matched one", differing.probe, MATCH);

        style.remove();
    });
</script>
