<!DOCTYPE html>
<style>
    .swap {
        --duration: 1s;
    }
    .icon {
        transition: opacity var(--duration);
    }
</style>
<div id="hidden" style="display: none"></div>
<script src="../../include.js"></script>
<script>
    test(() => {
        document.body.offsetWidth;

        // Elements inserted below a hidden element are left unstyled. A new style sheet then
        // styles the icons and the <use> elements below them in several waves, and the host
        // styles each icon's unstyled .swap ancestor with the wave that installs the icon.
        hidden.innerHTML = `<span class="swap"><span class="icon"><svg><use></use></svg></span><span class="icon"><svg><use></use></svg></span></span>`;
        document.body.offsetWidth;

        const style = document.createElement("style");
        style.textContent = ".icon { color: green } use { fill: red } #banner { color: blue }";
        document.head.appendChild(style);
        const banner = document.createElement("div");
        banner.id = "banner";
        banner.textContent = "banner";
        document.body.appendChild(banner);
        println(`banner height: ${banner.clientHeight > 0}`);
        println(`banner color: ${getComputedStyle(banner).color}`);
        for (const use of hidden.querySelectorAll("use"))
            println(`use fill: ${getComputedStyle(use).fill}`);
    });
</script>
