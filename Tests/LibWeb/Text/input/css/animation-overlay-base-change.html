<!DOCTYPE html>
<script src="../include.js"></script>
<style>
    #target { opacity: 0.1; margin-left: 0px; }
    #target.spaced { margin-left: 20px; }
</style>
<div id="target"></div>
<script>
    test(() => {
        const target = document.getElementById("target");
        const animation = target.animate({ opacity: [0.2, 0.6] }, { duration: 1000, fill: "both" });
        animation.pause();
        animation.currentTime = 500;
        const read = () => `${getComputedStyle(target).opacity} ${getComputedStyle(target).marginLeft}`;
        println(`sampled: ${read()}`);
        target.classList.add("spaced");
        println(`new base: ${read()}`);
        animation.cancel();
        println(`cancelled: ${read()}`);
    });
</script>
