<!DOCTYPE html>
<script src="../include.js"></script>
<div id="target-class" class="foo">class target</div>
<div id="non-target-class" class="bar">class non-target</div>
<div id="target-id">id target</div>
<div id="non-target-id">id non-target</div>
<p id="target-tag">tag target</p>
<div id="non-target-tag">tag non-target</div>
<div id="target-has" class="haystack"><span class="needle">has target</span></div>
<div id="non-target-has" class="haystack">has non-target</div>
<div id="universal-scope"><span id="universal-descendant">universal descendant</span></div>
<div id="universal-outside"><span id="universal-outside-descendant">universal outside descendant</span></div>
<div id="first-child-scope" data-scope="yes"><span id="first-child-target">first child target</span><span id="first-child-non-target">first child non-target</span></div>
<script>
    function addRemoveSheetAndCheck(description, css, checksWhilePresent, checksAfterRemoval) {
        document.body.offsetWidth;
        const style = document.createElement("style");
        style.textContent = css;
        document.head.appendChild(style);

        let pass = true;
        for (const [id, property, expected] of checksWhilePresent) {
            const actual = getComputedStyle(document.getElementById(id))[property];
            if (actual !== expected) {
                println(`FAIL: ${description} while present - ${id}: expected ${expected}, got ${actual}`);
                pass = false;
            }
        }

        style.remove();

        for (const [id, property, expected] of checksAfterRemoval) {
            const actual = getComputedStyle(document.getElementById(id))[property];
            if (actual !== expected) {
                println(`FAIL: ${description} after removal - ${id}: expected ${expected}, got ${actual}`);
                pass = false;
            }
        }

        if (pass)
            println(`PASS: ${description}`);
    }

    test(() => {
        const BLACK = "rgb(0, 0, 0)";
        const TRANSPARENT = "rgba(0, 0, 0, 0)";

        addRemoveSheetAndCheck("class selector", ".foo { color: rgb(255, 0, 0); }", [
            ["target-class", "color", "rgb(255, 0, 0)"],
            ["non-target-class", "color", BLACK],
        ], [
            ["target-class", "color", BLACK],
            ["non-target-class", "color", BLACK],
        ]);

        addRemoveSheetAndCheck("id selector", "#target-id { color: rgb(0, 128, 0); }", [
            ["target-id", "color", "rgb(0, 128, 0)"],
            ["non-target-id", "color", BLACK],
        ], [
            ["target-id", "color", BLACK],
            ["non-target-id", "color", BLACK],
        ]);

        addRemoveSheetAndCheck("tag selector", "p { background-color: rgb(0, 0, 255); }", [
            ["target-tag", "backgroundColor", "rgb(0, 0, 255)"],
            ["non-target-tag", "backgroundColor", TRANSPARENT],
        ], [
            ["target-tag", "backgroundColor", TRANSPARENT],
            ["non-target-tag", "backgroundColor", TRANSPARENT],
        ]);

        addRemoveSheetAndCheck("descendant universal selector", "#universal-scope * { color: rgb(40, 120, 220); }", [
            ["universal-descendant", "color", "rgb(40, 120, 220)"],
            ["universal-outside-descendant", "color", BLACK],
        ], [
            ["universal-descendant", "color", BLACK],
            ["universal-outside-descendant", "color", BLACK],
        ]);

        addRemoveSheetAndCheck("direct child structural selector", "[data-scope] > :first-child { color: rgb(200, 90, 40); }", [
            ["first-child-target", "color", "rgb(200, 90, 40)"],
            ["first-child-non-target", "color", BLACK],
        ], [
            ["first-child-target", "color", BLACK],
            ["first-child-non-target", "color", BLACK],
        ]);

        addRemoveSheetAndCheck(":has() with class", ".haystack:has(.needle) { background-color: rgb(100, 50, 200); }", [
            ["target-has", "backgroundColor", "rgb(100, 50, 200)"],
            ["non-target-has", "backgroundColor", TRANSPARENT],
        ], [
            ["target-has", "backgroundColor", TRANSPARENT],
            ["non-target-has", "backgroundColor", TRANSPARENT],
        ]);
    });
</script>
