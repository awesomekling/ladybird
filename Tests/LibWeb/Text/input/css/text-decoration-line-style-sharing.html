<!DOCTYPE html>
<script src="../include.js"></script>
<style>
    .underline { text-decoration-line: underline; }
    .overline { text-decoration-line: overline; }
    .line-through { text-decoration-line: line-through; }
</style>
<script>
    test(() => {
        for (const decoration of ["underline", "overline", "line-through"]) {
            const parent = document.createElement("div");
            parent.className = decoration;
            parent.append(document.createElement("span"));
            document.body.append(parent);
        }
        internals.updateStyle();
        const children = [...document.querySelectorAll("span")];
        for (const child of children)
            println(getComputedStyle(child).textDecorationLine);
        // The engine's cohort counter also includes pseudo-element records. Compare the element
        // records to count sharing among these spans alone.
        const firstRecord = internals.styleRecordIdentity(children[0]);
        const sharedStyles = children.slice(1).filter(child => firstRecord !== 0 && internals.styleRecordIdentity(child) === firstRecord).length;
        println(`shared styles: ${sharedStyles}`);
    });
</script>
