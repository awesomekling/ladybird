<!DOCTYPE html>
<script src="../include.js"></script>
<script>
    async function waitUntil(condition) {
        for (let i = 0; i < 50; ++i) {
            if (condition())
                return;
            await animationFrame();
        }
        throw new Error("Timed out waiting for condition");
    }

    async function waitForAnimationFrames(count) {
        for (let i = 0; i < count; ++i)
            await animationFrame();
    }

    promiseTest(async () => {
        const importedSheetText = `
            @font-face {
                font-family: "MediaInactiveImportedFont";
                src: url("../../Assets/HashSans.woff");
            }

            body {
                font-family: "MediaInactiveImportedFont";
            }
        `;

        const style = document.createElement("style");
        document.head.appendChild(style);

        const sheet = style.sheet;
        sheet.disabled = true;
        sheet.media.mediaText = "print";
        sheet.insertRule(`@import "data:text/css;base64,${btoa(importedSheetText)}";`, 0);

        await waitForAnimationFrames(2);
        println(`while disabled font count: ${document.fonts.size}`);

        sheet.disabled = false;
        await waitForAnimationFrames(8);
        println(`after re-enable with print media font count: ${document.fonts.size}`);

        sheet.media.mediaText = "all";
        await waitUntil(() => document.fonts.size === 1);
        println(`after media matches font count: ${document.fonts.size}`);
    });
</script>
