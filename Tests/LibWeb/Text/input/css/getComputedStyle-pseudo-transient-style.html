<!DOCTYPE html>
<script src="../include.js"></script>
<style id="rules">
    #outer::selection { color: rgb(10, 20, 30); background-color: rgb(40, 50, 60); }
    #middle::selection { text-decoration-color: rgb(70, 80, 90); }
    #target::selection { text-shadow: rgb(100, 110, 120) 1px 2px; }
    .pseudo::before { content: "before"; color: rgb(11, 12, 13); }
    .pseudo::after { content: "after"; color: rgb(21, 22, 23); }
    .pseudo::first-letter { color: rgb(31, 32, 33); }
    .pseudo::marker { color: rgb(41, 42, 43); }
    .pseudo::placeholder { color: rgb(51, 52, 53); }
    .pseudo::backdrop { color: rgb(61, 62, 63); }
    .no-box { display: none; }
</style>
<div id="outer"><div id="middle"><div id="target">selection</div></div></div>
<div id="visible" class="pseudo">visible</div>
<div id="contents" class="pseudo" style="display: contents">contents</div>
<div class="no-box"><div id="hidden" class="pseudo">hidden</div></div>
<ul><li id="marker" class="pseudo">marker</li></ul>
<input id="placeholder" class="pseudo" placeholder="placeholder">
<div id="host"></div>
<script>
    test(() => {
        const describe = (element, pseudo) => {
            const style = getComputedStyle(element, pseudo);
            return `${pseudo}: ${style.color} / ${style.backgroundColor} / ${style.content}`;
        };

        println(`deep selection: ${describe(target, "::selection")} / ${getComputedStyle(target, "::selection").textDecorationColor} / ${getComputedStyle(target, "::selection").textShadow}`);
        for (const element of [visible, contents, hidden]) {
            println(`${element.id} ${describe(element, "::before")}`);
            println(`${element.id} ${describe(element, "::after")}`);
            println(`${element.id} ${describe(element, "::first-letter")}`);
            println(`${element.id} ${describe(element, "::backdrop")}`);
        }
        println(`marker ${describe(marker, "::marker")}`);
        println(`placeholder ${describe(placeholder, "::placeholder")}`);

        const shadow = host.attachShadow({ mode: "open" });
        shadow.innerHTML = `<style>:host::selection { background-color: rgb(71, 72, 73); } #shadow-target::selection { color: rgb(81, 82, 83); } #shadow-target::before { content: "shadow"; color: rgb(91, 92, 93); }</style><span id="shadow-target">shadow</span>`;
        const shadowTarget = shadow.getElementById("shadow-target");
        println(`shadow selection: ${describe(shadowTarget, "::selection")}`);
        println(`shadow before: ${describe(shadowTarget, "::before")}`);

        visible.style.color = "rgb(101, 102, 103)";
        println(`before after originating style mutation: ${describe(visible, "::before")}`);
        rules.sheet.cssRules[0].style.backgroundColor = "rgb(111, 112, 113)";
        println(`selection after ancestor rule mutation: ${describe(target, "::selection")}`);
        println(`selection reread: ${describe(target, "::selection")}`);
    });
</script>
