<!DOCTYPE html>
<style>
    body {
        margin: 0;
    }
    #outer {
        width: 300px;
        height: 100px;
        transform: translateX(50px);
    }
    #target {
        width: 200px;
        height: 50px;
    }
</style>
<div id="outer"><div id="target"></div></div>
<script src="../include.js"></script>
<script>
    test(() => {
        // The click's offset is taken from where the mouseup listener moved the transformed target to.
        const target = document.getElementById("target");
        target.addEventListener("mouseup", event => {
            println(`mouseup offset: ${event.offsetX},${event.offsetY}`);
            target.style.marginLeft = "20px";
        });
        target.addEventListener("click", event => println(`click offset: ${event.offsetX},${event.offsetY}`));
        internals.click(100, 10);
    });
</script>
