<!DOCTYPE html>
<script src="../../include.js"></script>
<script src="frame-in-flight.js"></script>
<iframe id="frame" style="width: 200px; height: 100px; border: none" srcdoc="<style>@media (min-width: 250px) { #inner { height: 40px } }</style><body style='margin: 0'><div id=inner>child</div>"></iframe>
<script>
    // An iframe resized by the layout pass a rendering update submits, which the child's read takes back in the middle
    // of a task. The parent has nothing left to lay out after that, and the child's box, viewport and media queries
    // read in the same task all see the viewport size the parent's pass gave it.
    asyncTest(async done => {
        const frameElement = document.getElementById("frame");
        if (!frameElement.contentDocument?.getElementById("inner"))
            await new Promise(resolve => frameElement.addEventListener("load", resolve, { once: true }));
        const child = frameElement.contentDocument;
        await twoFrames();

        const result = await whileLayoutInFlight("before-completion", () => {
            frameElement.style.width = "300px";
        }, frame => {
            internals.releaseHeldFrame();
            internals.waitForFrameToFinish();
            const inner = child.getElementById("inner");
            const childBox = `${inner.offsetWidth}x${inner.offsetHeight}`;
            return {
                ...frame,
                childBox,
                innerWidth: child.defaultView.innerWidth,
                matches: child.defaultView.matchMedia("(min-width: 250px)").matches,
            };
        }, document);
        println(`held as armed: ${layoutHeldAsArmed(result, "before-completion")}`);
        println(`child viewport width: ${result.innerWidth}`);
        println(`child media query matches: ${result.matches}`);
        println(`child box: ${result.childBox}`);
        println(`layout passes held: ${layoutHoldsWereHeld(1)}`);
        done();
    });
</script>
