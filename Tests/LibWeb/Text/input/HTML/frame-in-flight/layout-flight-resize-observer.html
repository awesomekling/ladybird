<!DOCTYPE html>
<script src="../../include.js"></script>
<script src="frame-in-flight.js"></script>
<div id="target" style="width: 50px; height: 50px"></div>
<script>
    // A ResizeObserver created while a layout pass is in flight: the rendering update gathers its observation after
    // the pass, so it is delivered once, with the size the target has after the task that observed it, as when the
    // task runs before the rendering update.
    asyncTest(async done => {
        const sizes = [];
        let observer;
        const frame = await whileLayoutInFlight("before-run", () => {
            target.style.width = "60px";
        }, frame => {
            target.style.width = "90px";
            observer = new ResizeObserver(entries => {
                for (const entry of entries)
                    sizes.push(`${entry.contentRect.width}x${entry.contentRect.height}`);
            });
            observer.observe(target);
            return frame;
        });
        println(`held as armed: ${layoutHeldAsArmed(frame, "before-run")}`);
        await twoFrames();
        println(`observed: ${sizes.join(",")}`);

        // Once observed, the target's resize is gathered by the rendering update that lays it out.
        target.style.width = "100px";
        await twoFrames();
        println(`resized: ${sizes.join(",")}`);
        observer.disconnect();
        println(`layout passes held: ${layoutHoldsWereHeld(1)}`);
        done();
    });
</script>
