<!DOCTYPE html>
<script src="../../include.js"></script>
<script src="frame-in-flight.js"></script>
<div id="box" style="width: 50px; height: 50px; background: blue"></div>
<script>
    // The frame finishes while nothing else happens on the main thread: no task is queued and no rendering update is
    // requested. The completion alone must bring the event loop around to take the frame in and run its tail.
    asyncTest(async done => {
        const frame = await whileFrameInFlight("before-completion", () => {
            box.style.backgroundColor = "green";
        }, frame => frame);
        println(`held as armed: ${heldAsArmed(frame, "before-completion")}`);
        // The helper released the frame when the task above returned; the only thing queued now is this timer.
        await new Promise(resolve => setTimeout(resolve, 50));
        println(`taken in and tail run: ${internals.frameSchedulerState() === "idle"}`);
        await twoFrames();
        println(`box width: ${box.offsetWidth}`);
        done();
    });
</script>
