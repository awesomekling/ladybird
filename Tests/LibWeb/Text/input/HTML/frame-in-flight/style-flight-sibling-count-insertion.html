<!DOCTYPE html>
<script src="../../include.js"></script>
<script src="frame-in-flight.js"></script>
<style>
    #counted { math-depth: sibling-count(); }
    .indexed { math-depth: sibling-index(); }
</style>
<div id="container"><div id="first"></div></div>
<div id="other"><div id="last"></div></div>
<script>
    // A style pass in flight computes a record that reads sibling-count() or sibling-index() for an element whose
    // style has never read one before. Siblings inserted beside the pass have to reach that record, although the
    // element only learns that its style reads a tree-counting function once the pass is taken in.
    asyncTest(async done => {
        const counted = document.createElement("div");
        counted.id = "counted";
        const frame = await whileStyleInFlight("before-completion", () => {
            container.appendChild(counted);
            last.className = "indexed";
            other.prepend(document.createElement("div"));
        }, frame => {
            container.appendChild(document.createElement("div"));
            container.appendChild(document.createElement("div"));
            other.prepend(document.createElement("div"));
            return frame;
        });
        println(`held as armed: ${styleHeldAsArmed(frame, "before-completion")}`);
        await twoFrames();
        println(`sibling-count: ${getComputedStyle(counted).mathDepth}`);
        println(`sibling-index: ${getComputedStyle(last).mathDepth}`);
        done();
    });
</script>
