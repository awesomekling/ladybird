<!DOCTYPE html>
<script src="../../include.js"></script>
<script src="frame-in-flight.js"></script>
<div id="box" style="width: 10px; height: 10px; background: green"></div>
<iframe id="frame" style="width: 100px; height: 50px; border: 0" srcdoc="<body style='margin: 0'><div id=inner style='width: 20px; height: 20px'></div></body>"></iframe>
<script>
    // The parent's recording draws a same-process iframe as the compositor context its own frames present into, so a
    // document that contains one records and presents in the flight that laid it out, as any other, while the iframe
    // has nothing to paint after it (layout-flight-presents-after-hosted-navigables covers when it does). Nothing is
    // printed until the end, as printing inserts nodes, whose tree build keeps a flight from presenting.
    asyncTest(async done => {
        await new Promise(resolve => frame.complete || frame.contentDocument?.readyState === "complete" ? resolve() : frame.addEventListener("load", resolve, { once: true }));
        internals.setRenderPresents(true);
        // The iframe paints its first frames after its load: until it has nothing left to paint, the parent's flights
        // leave their paint to the rendering update.
        for (let i = 0; i < 3; ++i)
            await twoFrames();
        internals.resetRenderingSchedulerCounters();
        for (const width of [20, 30, 40]) {
            box.style.width = `${width}px`;
            await twoFrames();
        }
        const ends = internals.getRenderingSchedulerCounters().flightEnds;
        internals.resetRenderPresents();
        let flights = 0;
        for (const byStage of Object.values(ends))
            for (const count of Object.values(byStage))
                flights += count;
        const frameRect = frame.getBoundingClientRect();
        println(`flights presented: ${flights === 0 || ends.done.present >= 2}`);
        println(`none refused their paint: ${ends.paintNotSealed.rounds === 0}`);
        println(`width: ${box.getBoundingClientRect().width}`);
        println(`inner width: ${frame.contentDocument.getElementById("inner").getBoundingClientRect().width}`);
        println(`hit test reaches the iframe: ${document.elementFromPoint(frameRect.x + 5, frameRect.y + 5) === frame}`);
        done();
    });
</script>
