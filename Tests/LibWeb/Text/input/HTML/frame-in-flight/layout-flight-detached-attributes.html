<!DOCTYPE html>
<script src="../../include.js"></script>
<script src="frame-in-flight.js"></script>
<div id="container" style="width: 300px"><div id="first" style="height: 10px">first</div><div id="second">second</div></div>
<script>
    // Attribute changes on elements outside the document beside a layout pass in flight: the style mirror keeps nothing
    // of such an element, so the change goes on beside the pass instead of taking it in, and the element is styled
    // once it is inserted.
    asyncTest(async done => {
        const removed = second;
        removed.remove();
        await twoFrames();
        let fresh;
        const result = await whileLayoutInFlight("before-run", () => {
            first.style.height = "20px";
        }, frame => {
            const joinsBefore = internals.forcedJoinCount("layout");
            fresh = document.createElement("div");
            fresh.setAttribute("id", "fresh");
            fresh.className = "wide";
            fresh.setAttribute("style", "height: 30px");
            removed.setAttribute("class", "wide");
            removed.removeAttribute("id");
            return {
                ...frame,
                joins: internals.forcedJoinCount("layout") - joinsBefore,
                stillInFlight: !frame.heldAt || internals.frameInFlightHoldsDocument(),
            };
        });
        println(`held as armed: ${layoutHeldAsArmed(result, "before-run")}`);
        println(`forced joins of the layout pass: ${result.joins}`);
        println(`layout pass still in flight after the writes: ${result.stillInFlight}`);
        container.appendChild(fresh);
        container.appendChild(removed);
        println(`fresh height: ${fresh.offsetHeight}`);
        println(`removed element class: ${removed.className}`);
        println(`container height: ${container.offsetHeight}`);
        done();
    });
</script>
