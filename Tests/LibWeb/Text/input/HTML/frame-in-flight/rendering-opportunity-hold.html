<!DOCTYPE html>
<script src="../../include.js"></script>
<script src="frame-in-flight.js"></script>
<div id="box" style="width: 10px; height: 10px; background: green"></div>
<script>
    // A rendering task that finds the previous rendering update's recording still in flight does not wait for it: it holds its opportunity, and the held rendering update runs once the frame
    // has finished and been taken in, ahead of the tasks queued meanwhile. The opportunity is never lost.
    asyncTest(async done => {
        const order = [];
        const held = await whileFrameInFlight("before-run", () => {
            box.style.width = "20px";
        }, async frame => {
            if (!frame.armed)
                return frame;
            const before = internals.getRenderingSchedulerCounters();
            requestAnimationFrame(() => order.push("animation frame"));
            internals.injectRenderingOpportunity(performance.now());
            // The rendering task the opportunity queued runs before this task.
            await nextTask();
            const whileHeld = internals.getRenderingSchedulerCounters();
            const facts = {
                ...frame,
                taskHeld: internals.renderingTaskHeld(),
                stillHeld: internals.waitForHeldFrame() === "before-run" && internals.frameSchedulerState() === "in-flight",
                heldTasks: whileHeld.renderingTasksHeld - before.renderingTasksHeld,
                updatesWhileHeld: whileHeld.updatesRun - before.updatesRun,
            };
            const { port1, port2 } = new MessageChannel();
            const messaged = new Promise(resolve => port1.onmessage = () => {
                order.push("message");
                resolve();
            });
            port2.postMessage(null);
            internals.releaseHeldFrame();
            internals.waitForFrameToFinish();
            await messaged;
            const after = internals.getRenderingSchedulerCounters();
            facts.aheadOfQueue = after.renderingTasksAheadOfQueue - before.renderingTasksAheadOfQueue;
            return facts;
        });
        println(`held as armed: ${heldAsArmed(held, "before-run")}`);
        println(`rendering task held its opportunity: ${!held.armed || (held.taskHeld && held.heldTasks === 1)}`);
        println(`frame still held, no rendering update: ${!held.armed || (held.stillHeld && held.updatesWhileHeld === 0)}`);
        println(`held update ran ahead of the queued task: ${!held.armed || (order.join() === "animation frame,message" && held.aheadOfQueue === 1)}`);
        await twoFrames();
        println(`width: ${box.getBoundingClientRect().width}`);
        done();
    });
</script>
