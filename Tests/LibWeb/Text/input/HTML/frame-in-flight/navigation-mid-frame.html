<!DOCTYPE html>
<script src="../../include.js"></script>
<script src="frame-in-flight.js"></script>
<iframe id="frame" style="width: 200px; height: 100px" srcdoc="<body style='background: blue'>first"></iframe>
<script>
    // An iframe navigates, and then has its document replaced by document.open(), while the frame that paints it is in
    // flight: the document whose recording is in flight is retired and the new one paints in a later frame.
    function loaded() {
        return new Promise(resolve => frame.addEventListener("load", resolve, { once: true }));
    }

    asyncTest(async done => {
        if (frame.contentDocument?.readyState !== "complete")
            await loaded();

        const navigated = await whileFrameInFlight("mid-recording", () => {
            frame.contentDocument.body.style.backgroundColor = "green";
        }, frameInFlight => {
            frame.srcdoc = "<body style='background: orange'>second";
            return frameInFlight;
        });
        await loaded();
        println(`navigation: held as armed: ${heldAsArmed(navigated, "mid-recording")}`);
        println(`navigation: new document: ${frame.contentDocument.body.textContent}`);

        const opened = await whileFrameInFlight("before-completion", () => {
            frame.contentDocument.body.style.backgroundColor = "purple";
        }, frameInFlight => {
            const doc = frame.contentDocument;
            doc.open();
            doc.write("<body style='background: teal'>third");
            doc.close();
            return frameInFlight;
        });
        println(`document.open: held as armed: ${heldAsArmed(opened, "before-completion")}`);
        await twoFrames();
        println(`document.open: document: ${frame.contentDocument.body.textContent}`);
        println(`document.open: body width: ${frame.contentDocument.body.offsetWidth > 0}`);
        done();
    });
</script>
