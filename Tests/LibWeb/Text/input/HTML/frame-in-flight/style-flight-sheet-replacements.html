<!DOCTYPE html>
<script src="../../include.js"></script>
<script src="frame-in-flight.js"></script>
<style id="first">#box { color: rgb(0, 0, 255); }</style>
<style id="third">#box { background-color: rgb(0, 0, 255); }</style>
<div id="box">box</div>
<script>
    // Style elements are removed and added beside a style pass in flight, and their changes wait for its drain. The
    // drain publishes them one at a time and in their order: the removal of a sheet's last copy retires its rules in
    // one step, which the changes after it wait for.
    asyncTest(async done => {
        let height = 10;
        const result = await whileStyleInFlight("before-run", () => {
            box.style.height = `${++height}px`;
        }, frame => {
            document.getElementById("first").remove();
            const second = document.createElement("style");
            second.textContent = "#box { color: rgb(0, 128, 0); }";
            document.head.appendChild(second);
            document.getElementById("third").remove();
            return frame;
        });
        println(`held as armed: ${styleHeldAsArmed(result, "before-run")}`);
        await twoFrames();
        println(`box: ${getComputedStyle(box).color} ${getComputedStyle(box).backgroundColor} ${getComputedStyle(box).height}`);
        done();
    });
</script>
