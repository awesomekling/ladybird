<!DOCTYPE html>
<script src="../../include.js"></script>
<script src="frame-in-flight.js"></script>
<style>
    #container { width: 300px; }
    .inserted { width: 123px; height: 10px; color: green; }
</style>
<div id="container"><div id="first" style="height: 10px"></div></div>
<template id="template"><p></p><div><div class="inserted"></div></div></template>
<script>
    // An insertion beside a recording in flight, then a computed style read that needs no layout, whose style update
    // goes on beside the recording, then a geometry read. The insertion's marks wait for the frame in the held journal,
    // and the inserted element has no box in the rows the recording was prepared with, so the geometry read has layout
    // to do and reads the element's real width.
    asyncTest(async done => {
        let height = 10;
        for (const kind of ["element", "fragment", "template"]) {
            const result = await whileFrameInFlight("mid-recording", () => {
                height += 5;
                first.style.height = `${height}px`;
            }, frame => {
                let inserted;
                if (kind === "element") {
                    inserted = document.createElement("div");
                    inserted.className = "inserted";
                    container.appendChild(inserted);
                } else if (kind === "fragment") {
                    const fragment = document.createDocumentFragment();
                    inserted = document.createElement("div");
                    inserted.className = "inserted";
                    fragment.appendChild(inserted);
                    container.appendChild(fragment);
                } else {
                    const fragment = template.content.cloneNode(true);
                    inserted = fragment.querySelector(".inserted");
                    container.appendChild(fragment);
                }
                const color = getComputedStyle(inserted).color;
                return { ...frame, color, offsetWidth: inserted.offsetWidth };
            });
            println(`${kind}: held as armed: ${heldAsArmed(result, "mid-recording")}`);
            println(`${kind}: computed color: ${result.color}`);
            println(`${kind}: offsetWidth: ${result.offsetWidth}`);
            await twoFrames();
        }
        done();
    });
</script>
