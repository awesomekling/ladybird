<!DOCTYPE html>
<script src="../../include.js"></script>
<script src="frame-in-flight.js"></script>
<style>
    body { margin: 0; }
    #box { width: 100px; height: 10px; background-color: green; }
</style>
<div id="box"></div>
<script>
    // A recording the frame in flight does not present (the render side presents nothing here) is the frame's consume
    // to publish. A main-thread record beside the frame, such as a display list dump, takes the frame in first, which
    // publishes it, and leaves the rest of the rendering update to the next one; it never finds that recording
    // unpublished.
    asyncTest(async done => {
        await twoFrames();
        internals.setRenderPresents(false);
        const result = await whileFrameInFlight("before-completion", () => {
            box.style.backgroundColor = "blue";
        }, frame => {
            const dump = internals.dumpDisplayList();
            return {
                ...frame,
                dumped: dump.length > 0,
                holdsAfter: internals.frameInFlightHoldsDocument(),
                stateAfter: internals.frameSchedulerState(),
            };
        });
        internals.resetRenderPresents();
        println(`held as armed: ${heldAsArmed(result, "before-completion")}`);
        println(`dumped: ${result.dumped}`);
        println(`took the frame in: ${!result.armed || !result.holdsAfter}`);
        println(`left the frame's tail to the next rendering update: ${!result.armed || result.stateAfter === "committed-tail-pending"}`);
        await twoFrames();
        println(`ran the tail: ${internals.frameSchedulerState() !== "committed-tail-pending"}`);
        println(`hit test finds the box: ${document.elementFromPoint(50, 5) === box}`);
        println(`color: ${getComputedStyle(box).backgroundColor}`);
        done();
    });
</script>
