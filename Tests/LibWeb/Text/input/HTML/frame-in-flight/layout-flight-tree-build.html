<!DOCTYPE html>
<script src="../../include.js"></script>
<script src="frame-in-flight.js"></script>
<div id="container" style="width: 300px">
    <div id="shown" style="display: none">shown<span id="inner">inner</span></div>
    <div id="kept" style="height: 10px">kept</div>
    <ol id="list"><li>one</li><li>two</li></ol>
</div>
<script>
    // Tree changes beside a layout frame in flight whose round builds the layout tree before its pass: the walk and the
    // pass run beside the task, and the next layout sees every change the task made, wherever the walk had got to.
    function report(label) {
        println(`${label}: shown: ${shown.offsetWidth}x${shown.offsetHeight}`);
        println(`${label}: children laid out: ${[...container.children].filter(child => child.getClientRects().length > 0).map(child => child.id || child.tagName).join(",")}`);
        println(`${label}: list items: ${list.children.length}, list height > 0: ${list.offsetHeight > 0}`);
        println(`${label}: tree matches a full rebuild: ${internals.compareLayoutTreeWithFullRebuild().matches}`);
    }

    asyncTest(async done => {
        // The round's build gives the shown element its boxes, and the task inserts into it and hides another.
        const inserted = await whileLayoutInFlight("before-run", () => {
            shown.style.display = "block";
        }, frame => {
            const added = document.createElement("div");
            added.id = "added";
            added.textContent = "added";
            added.style.height = "7px";
            shown.appendChild(added);
            kept.style.display = "none";
            return frame;
        });
        println(`insertion: held as armed: ${layoutHeldAsArmed(inserted, "before-run")}`);
        await twoFrames();
        report("insertion");

        // The build and the pass have run: the task removes a node the build gave a box and shows one it took away.
        const removed = await whileLayoutInFlight("before-completion", () => {
            inner.style.display = "block";
            list.appendChild(document.createElement("li")).textContent = "three";
        }, frame => {
            inner.remove();
            kept.style.display = "block";
            list.firstElementChild.remove();
            return frame;
        });
        println(`removal: held as armed: ${layoutHeldAsArmed(removed, "before-completion")}`);
        await twoFrames();
        report("removal");

        // A layout read beside the build takes the frame back and sees the new tree, and the display change the task
        // makes after it is laid out by the next layout.
        const read = await whileLayoutInFlight("before-run", () => {
            shown.style.display = "inline-block";
        }, frame => {
            const width = shown.getBoundingClientRect().width > 0;
            shown.style.display = "none";
            return { ...frame, width };
        });
        println(`read: held as armed: ${layoutHeldAsArmed(read, "before-run")}`);
        println(`read: shown had a box: ${read.width}`);
        await twoFrames();
        report("read");
        done();
    });
</script>
