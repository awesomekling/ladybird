<!DOCTYPE html>
<script src="../../include.js"></script>
<script src="frame-in-flight.js"></script>
<style>
    #box { width: 10px; height: 10px; color: blue; }
    #box.wide { width: 30px; color: green; }
</style>
<div id="container"><div id="box">box</div><div id="other">other</div></div>
<script>
    // A selector query beside a frame in flight that runs a rendering update's style and layout sees what a write beside
    // the frame changed.
    asyncTest(async done => {
        await twoFrames();
        const result = await whileFrameInFlight("before-run", () => {
            box.className = "wide";
        }, frame => {
            other.className = "changed";
            const queried = document.querySelector("#container > .changed");
            return { ...frame, queried: queried ? queried.id : "nothing" };
        });
        await twoFrames();
        println(`held as armed: ${heldAsArmed(result, "before-run")}`);
        println(`query found: ${result.queried}`);
        println(`box width: ${box.offsetWidth}`);
        println(`box color: ${getComputedStyle(box).color}`);
        done();
    });
</script>
