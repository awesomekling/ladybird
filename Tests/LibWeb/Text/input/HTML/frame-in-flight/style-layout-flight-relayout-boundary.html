<!DOCTYPE html>
<script src="../../include.js"></script>
<script src="frame-in-flight.js"></script>
<style>
    #container { position: relative; width: 200px; height: 100px; }
    #box { position: absolute; left: 10px; top: 5px; width: 10px; height: 10px; }
    #box.wide { width: 30px; }
</style>
<div id="container"><div id="box"><span id="inner">box</span></div><div id="other">other</div></div>
<script>
    // A style change that relayouts an absolutely positioned partial relayout boundary, run in the flight that lays the
    // document out: the flight applies it to the layout nodes itself, confining the relayout to the boundary as the main
    // thread's install would, and the box and what it holds are laid out at their new size.
    function flightCounts() {
        const counters = internals.getRenderingSchedulerCounters();
        let styleFlights = 0;
        for (const count of Object.values(counters.flightStyleEnds))
            styleFlights += count;
        return { styleFlights, applied: counters.flightStyleEnds.applied };
    }

    asyncTest(async done => {
        await twoFrames();
        const before = flightCounts();
        await whileFrameInFlight("before-run", () => {
            box.className = "wide";
        }, frame => frame);
        await twoFrames();
        const after = flightCounts();
        // Without LIBWEB_FLIGHT_STYLE=1 no flight runs its layout's style.
        const styleRanInLayoutFlight = after.styleFlights > before.styleFlights;
        println(`style applied in its flight: ${!styleRanInLayoutFlight || after.applied > before.applied}`);
        println(`box: ${box.offsetLeft} ${box.offsetTop} ${box.offsetWidth}x${box.offsetHeight}`);
        println(`inner left: ${inner.getBoundingClientRect().left - container.getBoundingClientRect().left}`);
        println(`other width: ${other.offsetWidth}`);
        done();
    });
</script>
