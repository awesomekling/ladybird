<!DOCTYPE html>
<script src="../../include.js"></script>
<script src="frame-in-flight.js"></script>
<style>
    body { margin: 0; }
    #box { height: 10px; padding: 2px; border: 1px solid red; transition: width 100s; width: 100px; }
    .tall #box { height: 40px; }
    #box::before { content: "a"; }
    .tall #box::before { content: "b"; }
    #hidden { display: none; }
    #hidden.other span { color: green; }
</style>
<div id="container"><div id="box"></div></div>
<div id="hidden"><span id="hiddenSpan">hidden</span></div>
<script>
    // A read of layout geometry that finds the document dirty beside a recording of it in flight starts its style
    // update beside the recording, which reaches no style engine, and takes the recording in once: where the update
    // installs a style in a box the recording reads, or else for its layout.
    // The rendering update records a change that lays nothing out: where a flight runs layout and recording in one, a
    // change that lays out goes into the flight, and a read has to wait for its layout.
    let repaints = 0;
    async function readBesideRecording(mutate, read) {
        box.style.height = `${box.offsetHeight + 1}px`;
        await twoFrames();
        return whileFrameInFlight("mid-recording", () => {
            box.style.backgroundColor = ++repaints % 2 ? "green" : "blue";
        }, frame => {
            mutate();
            const before = internals.getJoinCounters().totals;
            const joinsBefore = internals.forcedJoinCount("recording");
            const value = read();
            const after = internals.getJoinCounters().totals;
            return {
                ...frame,
                value,
                started: after.stylesBesideRecording - before.stylesBesideRecording,
                finished: after.stylesFinishedBesideRecording - before.stylesFinishedBesideRecording,
                joins: internals.forcedJoinCount("recording") - joinsBefore,
            };
        });
    }

    function report(name, result, finishedBeside) {
        println(`${name}: held as armed: ${heldAsArmed(result, "mid-recording")}`);
        println(`${name}: style update started beside the recording: ${!result.armed || result.started === 1}`);
        println(`${name}: style update finished beside the recording: ${!result.armed ? finishedBeside : result.finished === 1}`);
        println(`${name}: took the recording in once: ${!result.armed || result.joins === 1}`);
        println(`${name}: read: ${result.value}`);
    }

    asyncTest(async done => {
        // The update restyles a box, and takes the recording in as it installs that style.
        const restyled = await readBesideRecording(() => {
            container.className = "tall";
            box.style.width = "200px";
        }, () => box.offsetHeight);
        report("restyled box", restyled, false);
        println(`restyled box: transitions started: ${box.getAnimations().length}`);
        println(`restyled box: ::before: ${getComputedStyle(box, "::before").content}`);

        // The update reaches no box, and the recording is taken in only for the layout.
        const boxless = await readBesideRecording(() => {
            hidden.className = "other";
        }, () => box.offsetHeight);
        report("no box restyled", boxless, true);
        println(`no box restyled: color: ${getComputedStyle(hiddenSpan).color}`);
        done();
    });
</script>
