<!DOCTYPE html>
<script src="../../include.js"></script>
<script src="frame-in-flight.js"></script>
<style>
    #box { height: 20px; }
    input:disabled { color: rgb(0, 128, 0); }
    div:dir(rtl) { color: rgb(0, 0, 255); }
</style>
<div id="box"></div>
<div id="pop" popover>popover</div>
<input id="field">
<input id="check" type="checkbox">
<div id="text">text</div>
<div id="host"></div>
<script>
    // Facts about elements that the style engine keeps beside their features, changed while the style pass is in
    // flight: the top layer, form control disabledness, directionality and slot assignment. None of them waits for the
    // pass, and the next style update sees each of them.
    asyncTest(async done => {
        const shadow = host.attachShadow({ mode: "open" });
        shadow.innerHTML = `<style>::slotted(span) { color: rgb(128, 0, 128); }</style><slot></slot>`;
        let height = 20;

        // `write` runs beside a pass of its own, since a write that joins takes the pass back for the ones after it.
        // `after` reads the outcome once the next style update has taken the write in.
        async function besidePass(name, write, after) {
            const result = await whileStyleInFlight("before-run", () => {
                box.style.height = `${++height}px`;
            }, frame => ({ ...frame, joined: writeJoinedStylePass(write) }));
            println(`${name}: held as armed: ${styleHeldAsArmed(result, "before-run")}`);
            println(`${name}: joined the pass: ${result.joined}`);
            await twoFrames();
            println(`${name}: after: ${after()}`);
        }

        await besidePass("a popover shown", () => {
            pop.showPopover();
        }, () => `open: ${pop.matches(":popover-open")}, position: ${getComputedStyle(pop).position}`);
        await besidePass("disabled inputs", () => {
            field.disabled = true;
            check.disabled = true;
        }, () => `${getComputedStyle(field).color} ${getComputedStyle(check).color}`);
        await besidePass("a direction", () => {
            text.dir = "rtl";
        }, () => getComputedStyle(text).color);
        const slotted = document.createElement("span");
        slotted.textContent = "slotted";
        await besidePass("a slotted child", () => {
            host.appendChild(slotted);
        }, () => getComputedStyle(slotted).color);
        done();
    });
</script>
