<!DOCTYPE html>
<script src="../../include.js"></script>
<script src="frame-in-flight.js"></script>
<style>
    #box { width: 100px; height: 20px; }
    #box.wide { width: 150px; }
    #contents { display: contents; }
    #list > li { height: 10px; }
</style>
<div id="box"></div>
<div id="contents"><span>contents</span></div>
<ul id="list"><li id="one">one</li><li id="two">two</li><li id="three">three</li></ul>
<script>
    // Mutations beside a style pass in flight that read an element's style record for the first time since the pass
    // was submitted: the read enters the style engine, which takes the pass back and finishes it, and finishing the
    // pass ends the record view epoch the read is caching the record's facts in.
    asyncTest(async done => {
        const mutated = await whileStyleInFlight("before-run", () => {
            box.classList.add("wide");
        }, frame => {
            // An insertion reads its parent's display (display: contents), and a removal reads the removed list item's.
            const span = document.createElement("span");
            span.textContent = "inserted";
            contents.appendChild(span);
            two.remove();
            return { ...frame, width: getComputedStyle(box).width };
        });
        println(`held as armed: ${styleHeldAsArmed(mutated, "before-run")}`);
        println(`width: ${mutated.width}`);
        await twoFrames();
        println(`contents children: ${contents.children.length}`);
        println(`list height: ${list.offsetHeight}`);
        println(`box width: ${box.offsetWidth}`);
        done();
    });
</script>
