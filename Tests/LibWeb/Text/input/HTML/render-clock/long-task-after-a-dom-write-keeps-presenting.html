<!DOCTYPE html>
<style>
    #box {
        width: 100px;
        height: 20px;
        animation: grow 20s linear;
    }
    @keyframes grow {
        from {
            width: 100px;
        }
        to {
            width: 2100px;
        }
    }
</style>
<div id="box"></div>
<div id="log"></div>
<script src="../../include.js"></script>
<script>
    // Under LIBWEB_RENDER_CLOCK_FRAMES, the render clock goes on presenting an animation in a long task after the task
    // inserts text elsewhere in the document, as a streaming chat does before it goes on with its work. The text shows
    // once the task is over.
    asyncTest(async done => {
        const log = document.getElementById("log");
        const enabled = internals.clockFramesEnabled();
        // Not a timing test: the task begins once the main thread lends the arena to the ticks beside it.
        const waitStart = performance.now();
        do
            await new Promise(resolve => setTimeout(resolve, 10));
        while (enabled && !internals.clockLendActive() && performance.now() - waitStart < 5000);
        const lentBeforeWrite = internals.clockLendActive();

        log.append("Every chunk does two things on the main thread. ");

        // Not a timing test: the task runs until the render side has presented enough frames, however slow the machine,
        // and gives up after a while if it presents none.
        const countersBefore = internals.getRenderClockCounters();
        const wanted = 3;
        const start = performance.now();
        let presented = 0;
        while (enabled && performance.now() - start < 2000) {
            presented = internals.getRenderClockCounters().ticksPresented - countersBefore.ticksPresented;
            if (presented >= wanted)
                break;
        }
        const needingMain = internals.getRenderClockCounters().ticksNeedingMain - countersBefore.ticksNeedingMain;

        await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
        println(`leases lent before the write: ${!enabled || lentBeforeWrite}`);
        println(`frames presented after the write: ${!enabled || presented >= wanted}`);
        println(`ticks needing the main thread: ${needingMain}`);
        println(`the text shows once the task is over: ${log.getBoundingClientRect().height > 0}`);
        done();
    });
</script>
