<!DOCTYPE html>
<style>
    #box {
        width: 100px;
        height: 20px;
        animation: grow 20s linear;
    }
    @keyframes grow {
        from {
            width: 100px;
        }
        to {
            width: 2100px;
        }
    }
</style>
<div id="box"></div>
<div id="removed">removed</div>
<div id="after">after</div>
<script src="../../include.js"></script>
<script>
    // Under LIBWEB_RENDER_CLOCK_FRAMES, a task that removes an element leaves the rest of the task to the main thread.
    // A nested event loop the task spins (here a synchronous XHR) must not lend the arena to the ticks again: they would
    // show the removal half done.
    asyncTest(async done => {
        const removed = document.getElementById("removed");
        const after = document.getElementById("after");
        const enabled = internals.clockFramesEnabled();
        const url = await httpTestServer().createEcho("GET", "/long-task-spinning-after-a-removal", {
            status: 200,
            headers: { "Access-Control-Allow-Origin": "*", "Cache-Control": "no-store" },
            body: "done",
            delay_ms: 300,
        });
        const topBefore = after.getBoundingClientRect().top;
        // Not a timing test: the task begins once the main thread lends the arena to the ticks beside it.
        const waitStart = performance.now();
        do
            await new Promise(resolve => setTimeout(resolve, 10));
        while (enabled && !internals.clockLendActive() && performance.now() - waitStart < 5000);
        const lentBeforeRemoval = internals.clockLendActive();

        removed.remove();

        const countersBefore = internals.getRenderClockCounters();
        const request = new XMLHttpRequest();
        request.open("GET", url, false);
        request.send();

        // The task goes on for a while after the nested loop; no tick presents a frame in it.
        const start = performance.now();
        while (enabled && performance.now() - start < 300) {
            if (internals.getRenderClockCounters().ticksPresented - countersBefore.ticksPresented >= 3)
                break;
        }
        const presented = internals.getRenderClockCounters().ticksPresented - countersBefore.ticksPresented;

        await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
        println(`leases lent before the removal: ${!enabled || lentBeforeRemoval}`);
        println(`request finished: ${request.responseText}`);
        println(`no frame presented after the removal: ${presented === 0}`);
        println(`the removal shows once the task is over: ${after.getBoundingClientRect().top < topBefore}`);
        done();
    });
</script>
