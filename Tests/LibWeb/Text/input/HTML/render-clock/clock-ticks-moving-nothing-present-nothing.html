<!DOCTYPE html>
<style>
    #box {
        width: 100px;
        height: 20px;
        animation: grow 20s steps(2);
    }
    @keyframes grow {
        from {
            width: 100px;
        }
        to {
            width: 2100px;
        }
    }
</style>
<div id="box"></div>
<script src="../../include.js"></script>
<script>
    function nextTask() {
        const { promise, resolve } = Promise.withResolvers();
        const channel = new MessageChannel();
        channel.port1.onmessage = resolve;
        channel.port2.postMessage(null);
        return promise;
    }

    async function frameTimeAfter(time) {
        while (performance.now() <= time + 1)
            await nextTask();
        return performance.now();
    }

    // Under LIBWEB_RENDER_CLOCK_FRAMES, a render clock tick that samples a steps() animation on the plateau of a step
    // moves nothing, and presents no frame: the render clock counts no frame for it.
    asyncTest(async done => {
        const enabled = internals.clockFramesEnabled();
        internals.setManualRenderingOpportunities(true, true);
        await nextTask();
        let frameTime = performance.now();
        for (let i = 0; i < 3; ++i) {
            frameTime = await frameTimeAfter(frameTime);
            internals.injectRenderingOpportunity(frameTime);
            await nextTask();
        }

        const countersBefore = internals.getRenderClockCounters();
        let taken = 0;
        for (let i = 0; i < 3; ++i) {
            frameTime = await frameTimeAfter(frameTime);
            if (await internals.injectClockTick(frameTime))
                ++taken;
        }
        const countersAfter = internals.getRenderClockCounters();
        internals.setManualRenderingOpportunities(false);

        println(`ticks a lease took: ${enabled ? taken : 3}`);
        println(`ticks that ran to the end: ${enabled ? countersAfter.ticksInstalled - countersBefore.ticksInstalled : 3}`);
        println(`frames presented: ${countersAfter.ticksPresented - countersBefore.ticksPresented}`);
        done();
    });
</script>
