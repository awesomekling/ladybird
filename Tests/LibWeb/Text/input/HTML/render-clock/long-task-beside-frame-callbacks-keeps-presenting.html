<!DOCTYPE html>
<style>
    #box {
        width: 100px;
        height: 20px;
        animation: grow 2s linear infinite alternate;
    }
    @keyframes grow {
        from {
            width: 100px;
        }
        to {
            width: 300px;
        }
    }
    #dot {
        position: relative;
        width: 10px;
        height: 10px;
    }
</style>
<div id="box"></div>
<div id="dot"></div>
<script src="../../include.js"></script>
<script>
    // Under LIBWEB_RENDER_CLOCK_FRAMES, the render clock goes on presenting an animation while script runs a long task,
    // even when the page has an animation frame callback waiting: a loop that moves another element in each frame.
    asyncTest(async done => {
        const dot = document.getElementById("dot");
        const enabled = internals.clockFramesEnabled();
        let frames = 0;
        let looping = true;
        function frame(now) {
            ++frames;
            dot.style.left = `${now % 100}px`;
            if (looping)
                requestAnimationFrame(frame);
        }
        requestAnimationFrame(frame);
        await new Promise(resolve => setTimeout(resolve, 100));

        // Not a timing test: the task runs until the render side has presented enough frames, however slow the
        // machine, and gives up after a while if it presents none.
        const framesBefore = frames;
        const countersBefore = internals.getRenderClockCounters();
        const wanted = 3;
        let presented = 0;
        const start = performance.now();
        while (enabled && performance.now() - start < 2000) {
            presented = internals.getRenderClockCounters().ticksPresented - countersBefore.ticksPresented;
            if (presented >= wanted)
                break;
        }
        const framesInTask = frames - framesBefore;

        await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
        looping = false;
        println(`frames presented during the task: ${!enabled || presented >= wanted}`);
        println(`animation frame callbacks during the task: ${framesInTask}`);
        println(`animation frame callbacks after the task: ${frames - framesBefore > 0}`);
        done();
    });
</script>
