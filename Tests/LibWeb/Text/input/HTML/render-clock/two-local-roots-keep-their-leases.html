<!DOCTYPE html>
<style>
    .box {
        width: 100px;
        height: 20px;
        animation: grow 20s linear;
    }
    @keyframes grow {
        from {
            width: 100px;
        }
        to {
            width: 2100px;
        }
    }
</style>
<div class="box"></div>
<script src="../../include.js"></script>
<script>
    // A window's document and a popup's, each a local root, render at rendering
    // opportunities of their own. A rendering update for one leaves the other's clock lease alone, so the render clock
    // ticks both.
    asyncTest(async done => {
        const popup = window.open();
        // Not a timing test. The popup may replace the document it opened with, which then takes the animation again.
        const start = performance.now();
        while (!(internals.renderClockTicks(document) && internals.renderClockTicks(popup.document)) && performance.now() - start < 10000) {
            if (!popup.document.querySelector(".box")) {
                popup.document.write(`<!DOCTYPE html><style>${document.querySelector("style").textContent}</style><div class="box"></div>`);
                popup.document.close();
            }
            await new Promise(resolve => setTimeout(resolve, 10));
        }
        println(`a render clock ticks both documents: ${internals.renderClockTicks(document) && internals.renderClockTicks(popup.document)}`);
        popup.close();
        done();
    });
</script>
