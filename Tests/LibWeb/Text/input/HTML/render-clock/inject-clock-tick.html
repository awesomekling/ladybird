<!DOCTYPE html>
<style>
    #box {
        width: 100px;
        height: 20px;
        animation: grow 20s linear;
    }
    @keyframes grow {
        from {
            width: 100px;
        }
        to {
            width: 2100px;
        }
    }
</style>
<div id="box"></div>
<script src="../../include.js"></script>
<script>
    function nextTask() {
        const { promise, resolve } = Promise.withResolvers();
        const channel = new MessageChannel();
        channel.port1.onmessage = resolve;
        channel.port2.postMessage(null);
        return promise;
    }

    // Under LIBWEB_RENDER_CLOCK_FRAMES with manual rendering opportunities and clock ticks, the display ticks the leases
    // see come from the test alone: each injected tick presents one frame from the render side, with no rendering
    // update, and a read after it sees the width composed at the time of the tick.
    asyncTest(async done => {
        const box = document.getElementById("box");
        const animation = box.getAnimations()[0];
        const enabled = internals.clockFramesEnabled();
        internals.setManualRenderingOpportunities(true, true);
        await nextTask();
        const start = performance.now();
        for (let i = 0; i < 3; ++i) {
            internals.injectRenderingOpportunity(start + i * 16);
            await nextTask();
        }

        const presentedBefore = internals.getRenderClockCounters().ticksPresented;
        const updatesBefore = internals.getRenderingSchedulerCounters().updatesRun;
        let taken = 0;
        let mismatches = 0;
        for (let i = 1; i <= 5; ++i) {
            if (await internals.injectClockTick(start + 32 + i * 16))
                ++taken;
            const time = animation.currentTime;
            if (Math.abs(box.getBoundingClientRect().width - (100 + (2000 * time) / 20000)) > 0.5)
                ++mismatches;
        }
        const presented = internals.getRenderClockCounters().ticksPresented - presentedBefore;
        const updates = internals.getRenderingSchedulerCounters().updatesRun - updatesBefore;
        internals.setManualRenderingOpportunities(false);

        println(`ticks a lease took: ${enabled ? taken : 5}`);
        println(`frames presented from the render side: ${enabled ? presented : 5}`);
        println(`rendering updates meanwhile: ${enabled ? updates : 0}`);
        println(`mismatches: ${mismatches}`);
        done();
    });
</script>
