<!DOCTYPE html>
<style>
    .box {
        width: 100px;
        height: 20px;
        animation: grow 20s linear;
    }
    @keyframes grow {
        from {
            width: 100px;
        }
        to {
            width: 2100px;
        }
    }
</style>
<div id="box" class="box"></div>
<script src="../../include.js"></script>
<script>
    // Under LIBWEB_RENDER_CLOCK_FRAMES, a long task lends the arenas of both its window's document and a popup's, each a
    // local root with a lease of its own, to the render clock's ticks. A read in one document takes that one back: the
    // ticks of the other go on.
    asyncTest(async done => {
        const popup = window.open();
        const box = document.getElementById("box");
        const enabled = internals.clockFramesEnabled();
        // Not a timing test: the popup gets its lease at a rendering update of its own. It may replace the document it
        // opened with before, which then takes the animation again. The task begins once the main thread lends the
        // arenas to the ticks beside it.
        const leased = () => internals.renderClockTicks(document) && internals.renderClockTicks(popup.document);
        const waitStart = performance.now();
        while (enabled && !(leased() && internals.clockLendActive()) && performance.now() - waitStart < 10000) {
            if (!popup.document.querySelector(".box")) {
                popup.document.write(`<!DOCTYPE html><style>${document.querySelector("style").textContent}</style><div class="box"></div>`);
                popup.document.close();
            }
            await new Promise(resolve => setTimeout(resolve, 10));
        }
        const bothTicked = !enabled || leased();

        const countersBefore = internals.getRenderClockCounters();
        const wanted = 6;
        const start = performance.now();
        let presented = 0;
        let read = false;
        let relent = false;
        while (enabled && performance.now() - start < 10000) {
            presented = internals.getRenderClockCounters().ticksPresented - countersBefore.ticksPresented;
            if (presented >= wanted)
                break;
            if (!read && presented >= 1) {
                read = true;
                // A computed style read reaches this document's style engine alone, and lends nothing again.
                getComputedStyle(box).width;
            }
            // A geometry read lends its document again once it is over, beside the one still lent.
            if (!relent && presented >= 3) {
                relent = true;
                box.getBoundingClientRect();
            }
        }
        const countersAfter = internals.getRenderClockCounters();
        println(`a render clock ticks both documents: ${bothTicked}`);
        println(`frames presented after a read in one took it back: ${!enabled || presented >= wanted}`);
        println(`a geometry read lent its document again: ${!enabled || countersAfter.relends > countersBefore.relends}`);
        popup.close();
        done();
    });
</script>
