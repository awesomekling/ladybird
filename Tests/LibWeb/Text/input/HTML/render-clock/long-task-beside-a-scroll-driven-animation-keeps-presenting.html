<!DOCTYPE html>
<style>
    body {
        height: 5000px;
        margin: 0;
    }
    #bar {
        position: fixed;
        top: 0;
        height: 10px;
        width: 0;
        animation: grow linear both;
        animation-timeline: scroll(root);
    }
    @keyframes grow {
        from {
            width: 0;
        }
        to {
            width: 1000px;
        }
    }
</style>
<div id="bar"></div>
<script src="../../include.js"></script>
<script>
    // Under LIBWEB_RENDER_CLOCK_FRAMES, the render clock goes on presenting a scroll-driven animation while script runs
    // a long task: its ticks sample the scroll timeline where the compositor scrolled the page to.
    asyncTest(async done => {
        const bar = document.getElementById("bar");
        const enabled = internals.clockFramesEnabled();
        // Not a timing test: the task begins once the main thread lends the arena to the ticks beside it.
        const waitStart = performance.now();
        do
            await new Promise(resolve => setTimeout(resolve, 10));
        while (enabled && !internals.clockLendActive() && performance.now() - waitStart < 5000);
        const lent = internals.clockLendActive();

        const countersBefore = internals.getRenderClockCounters();
        internals.wheelThroughUIProcess(10, 100, 0, 400);
        // Not a timing test: the task runs until the render side has presented a frame, however slow the machine, and
        // gives up after a while if it presents none.
        const start = performance.now();
        let presented = 0;
        let followingScroll = 0;
        while (enabled && performance.now() - start < 5000) {
            const counters = internals.getRenderClockCounters();
            presented = counters.ticksPresented - countersBefore.ticksPresented;
            followingScroll = counters.ticksFollowingScroll - countersBefore.ticksFollowingScroll;
            if (presented >= 1 && followingScroll >= 1)
                break;
        }
        const needingMain = internals.getRenderClockCounters().ticksNeedingMain - countersBefore.ticksNeedingMain;

        // Not a timing test: the main thread takes the scroll in once the task is over.
        const scrollWaitStart = performance.now();
        do
            await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
        while (scrollY === 0 && performance.now() - scrollWaitStart < 5000);
        const maxScroll = document.documentElement.scrollHeight - innerHeight;
        const expectedWidth = (1000 * scrollY) / maxScroll;
        println(`leases lent before the task: ${!enabled || lent}`);
        println(`frames presented during the task: ${!enabled || presented >= 1}`);
        println(`ticks followed the compositor's scrolling: ${!enabled || followingScroll >= 1}`);
        println(`ticks needing the main thread: ${needingMain}`);
        println(`scrolled: ${scrollY > 0}`);
        println(`width follows the scroll: ${Math.abs(bar.getBoundingClientRect().width - expectedWidth) < 1}`);
        done();
    });
</script>
