<!DOCTYPE html>
<style>
    #box {
        width: 100px;
        height: 20px;
        animation: grow 20s linear;
    }
    @keyframes grow {
        from {
            width: 100px;
        }
        to {
            width: 2100px;
        }
    }
</style>
<div id="box"></div>
<script src="../../include.js"></script>
<script>
    // The render clock ticks nothing for a hidden page, whose lease ends as it is hidden (and whose context the
    // Compositor delivers no display ticks for), and ticks its animation again once it is visible.
    asyncTest(async done => {
        const ticks = () => internals.getRenderClockCounters().ticksInstalled;
        // Waits for the render clock to install a tick, however long the display takes to deliver it.
        const nextTick = async () => {
            const target = ticks() + 1;
            do
                await new Promise(resolve => setTimeout(resolve, 5));
            while (ticks() < target);
        };

        await nextTick();
        println(`visible: ticks advance: true`);

        // Once the page is hidden, the lease takes no tick whenever the main thread goes idle: a tick already in the
        // air finds it paused.
        await setSystemVisibilityState("hidden");
        const before = ticks();
        for (let i = 0; i < 10; ++i)
            await new Promise(resolve => setTimeout(resolve, 5));
        println(`hidden: ticks advance: ${ticks() > before}`);
        println(`hidden: the render clock ticks the page: ${internals.renderClockTicks(document)}`);

        await setSystemVisibilityState("visible");
        await nextTick();
        println(`visible again: ticks advance: true`);
        done();
    });
</script>
