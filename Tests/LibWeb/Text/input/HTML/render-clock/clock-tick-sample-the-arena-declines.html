<!DOCTYPE html>
<style>
    #box {
        width: 100px;
        height: 20px;
        animation: grow 800ms linear -200ms;
    }
    @keyframes grow {
        from {
            width: 100px;
            text-transform: none;
        }
        to {
            width: 900px;
            text-transform: uppercase;
        }
    }
</style>
<div id="box">text</div>
<script src="../../include.js"></script>
<script>
    function nextTask() {
        const { promise, resolve } = Promise.withResolvers();
        const channel = new MessageChannel();
        channel.port1.onmessage = resolve;
        channel.port2.postMessage(null);
        return promise;
    }

    // A frame time past `time`, and not past now: the time a display tick at the next frame carries.
    async function frameTimeAfter(time) {
        while (performance.now() <= time + 1)
            await nextTask();
        return performance.now();
    }

    // Under LIBWEB_RENDER_CLOCK_FRAMES, a render clock tick whose sample the arena cannot take (text-transform flips
    // halfway and needs a layout tree build) ends the lease: no later tick samples over the record only the host's
    // adoption keeps alive. The main thread adopts the tick and takes the animation over.
    asyncTest(async done => {
        const box = document.getElementById("box");
        const animation = box.getAnimations()[0];
        const enabled = internals.clockFramesEnabled();
        internals.setManualRenderingOpportunities(true, true);
        await nextTask();
        let frameTime = performance.now();
        for (let i = 0; i < 3; ++i) {
            frameTime = await frameTimeAfter(frameTime);
            internals.injectRenderingOpportunity(frameTime);
            await nextTask();
        }

        // Before the flip, then past it, then once more, which finds the lease ended.
        const flip = animation.startTime + 200;
        const counters = internals.getRenderClockCounters();
        frameTime = await frameTimeAfter(frameTime);
        const beforeFlip = frameTime < flip && (await internals.injectClockTick(frameTime));
        frameTime = await frameTimeAfter(flip);
        const pastFlip = await internals.injectClockTick(frameTime);
        const after = internals.getRenderClockCounters();
        frameTime = await frameTimeAfter(frameTime);
        const onceMore = await internals.injectClockTick(frameTime);
        println(`ticks before and past the flip taken: ${!enabled || (beforeFlip && pastFlip)}`);
        println(`the tick past the flip needed the main thread: ${!enabled || after.ticksNeedingMain === counters.ticksNeedingMain + 1}`);
        println(`no tick after it: ${!enabled || !onceMore}`);

        // The main thread takes the animation over.
        for (let i = 0; i < 3; ++i) {
            frameTime = await frameTimeAfter(frameTime);
            internals.injectRenderingOpportunity(frameTime);
            await nextTask();
        }
        const time = animation.currentTime;
        println(`text-transform after the flip: ${getComputedStyle(box).textTransform}`);
        println(`text after the flip: ${box.innerText}`);
        println(`width is the one composed at currentTime: ${Math.abs(box.getBoundingClientRect().width - (300 + time)) <= 0.5}`);
        internals.setManualRenderingOpportunities(false);
        done();
    });
</script>
