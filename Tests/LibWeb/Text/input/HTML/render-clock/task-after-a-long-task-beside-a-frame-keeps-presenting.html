<!DOCTYPE html>
<style>
    #box {
        width: 100px;
        height: 20px;
        animation: grow 2s linear infinite alternate;
    }
    @keyframes grow {
        from {
            width: 100px;
        }
        to {
            width: 300px;
        }
    }
    #dot {
        position: relative;
        width: 10px;
        height: 10px;
    }
</style>
<div id="box"></div>
<div id="dot"></div>
<script src="../../include.js"></script>
<script>
    // Under LIBWEB_RENDER_CLOCK_FRAMES, the render clock goes on presenting an animation in a task that follows a long
    // task, even where the frame of the rendering update between them is still in flight as the task begins.
    asyncTest(async done => {
        const dot = document.getElementById("dot");
        const enabled = internals.clockFramesEnabled();
        let presented = 0;
        let nextTaskRan = null;
        const nextTask = new Promise(resolve => nextTaskRan = resolve);
        const wanted = 3;

        function busyLoopUntilPresented() {
            // Not a timing test: the task runs until the render side has presented enough frames, however slow the
            // machine, and gives up after a while if it presents none.
            const countersBefore = internals.getRenderClockCounters();
            const start = performance.now();
            while (enabled && performance.now() - start < 2000) {
                presented = internals.getRenderClockCounters().ticksPresented - countersBefore.ticksPresented;
                if (presented >= wanted)
                    break;
            }
            nextTaskRan();
        }

        let afterLongTask = false;
        let looping = true;
        function frame(now) {
            dot.style.left = `${now % 100}px`;
            // The task can begin while the frame of this rendering update is in flight.
            if (afterLongTask) {
                afterLongTask = false;
                setTimeout(busyLoopUntilPresented, 0);
            }
            if (looping)
                requestAnimationFrame(frame);
        }
        requestAnimationFrame(frame);
        await new Promise(resolve => setTimeout(resolve, 100));

        // A long task, with a lease lent beside it.
        const start = performance.now();
        while (performance.now() - start < 60) { }
        afterLongTask = true;
        await nextTask;

        await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
        looping = false;
        println(`frames presented during the task after the long task: ${!enabled || presented >= wanted}`);
        done();
    });
</script>
