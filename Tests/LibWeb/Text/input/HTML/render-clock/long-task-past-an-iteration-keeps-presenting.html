<!DOCTYPE html>
<style>
    #box {
        width: 100px;
        height: 20px;
        animation: grow 100ms linear infinite alternate;
    }
    @keyframes grow {
        from {
            width: 100px;
            background-color: rgb(0, 0, 0);
        }
        to {
            width: 300px;
            background-color: rgb(0, 0, 200);
        }
    }
</style>
<div id="box"></div>
<script src="../../include.js"></script>
<script>
    // Under LIBWEB_RENDER_CLOCK_FRAMES, the render clock goes on presenting an animation whose iterations end while
    // script runs a long task. Its animationiteration events wait for the task to end, and the rendering update after
    // it sends them.
    asyncTest(async done => {
        const box = document.getElementById("box");
        const enabled = internals.clockFramesEnabled();
        let iterations = 0;
        box.addEventListener("animationiteration", () => ++iterations);
        await box.getAnimations()[0].ready;
        // Not a timing test: the task begins once the main thread lends the arena to the ticks beside it.
        const waitStart = performance.now();
        do
            await new Promise(resolve => setTimeout(resolve, 10));
        while (enabled && !internals.clockLendActive() && performance.now() - waitStart < 10000);

        // Not a timing test: past two iterations of the animation, the task runs until the render side has presented
        // enough more frames, however slow the machine.
        const iterationsBefore = iterations;
        const start = performance.now();
        while (performance.now() - start < 200) { }
        const countersPastAnIteration = internals.getRenderClockCounters();
        const wanted = 3;
        let presented = 0;
        while (enabled && performance.now() - start < 10000) {
            presented = internals.getRenderClockCounters().ticksPresented - countersPastAnIteration.ticksPresented;
            if (presented >= wanted)
                break;
        }
        const iterationsInTask = iterations - iterationsBefore;

        await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
        println(`frames presented past an iteration: ${!enabled || presented >= wanted}`);
        println(`iteration events during the task: ${iterationsInTask}`);
        println(`iteration events after the task: ${iterations - iterationsBefore > 0}`);
        done();
    });
</script>
