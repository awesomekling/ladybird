<!DOCTYPE html>
<style>
    #box {
        width: 100px;
        height: 20px;
        animation: grow 20s linear;
    }
    @keyframes grow {
        from {
            width: 100px;
            background-color: rgb(0, 0, 0);
        }
        to {
            width: 2100px;
            background-color: rgb(0, 0, 200);
        }
    }
</style>
<div id="box"></div>
<script src="../../include.js"></script>
<script>
    // The render clock ticks an idle page's width and background color animation at
    // the display's ticks and presents each frame from the render side: the main thread runs no rendering update for
    // it while it idles. Once it wakes, it reads the animation at the time of the last frame presented.
    asyncTest(async done => {
        const box = document.getElementById("box");
        const animation = box.getAnimations()[0];
        const ticksPresented = () => internals.getRenderClockCounters().ticksPresented;
        // The first frame the render clock presents, and then ten more, however long the display takes to tick.
        const waitForFrames = async count => {
            const target = ticksPresented() + count;
            do
                await new Promise(resolve => setTimeout(resolve, 10));
            while (ticksPresented() < target);
        };
        await waitForFrames(1);

        const presentedBefore = ticksPresented();
        const updatesBefore = internals.getRenderingSchedulerCounters().updatesRun;
        await waitForFrames(10);
        const presented = ticksPresented() - presentedBefore;
        const updates = internals.getRenderingSchedulerCounters().updatesRun - updatesBefore;

        const time = animation.currentTime;
        const width = box.getBoundingClientRect().width;
        const blue = Number(getComputedStyle(box).backgroundColor.match(/\d+/g)[2]);
        println(`frames presented from the render side: ${presented >= 10}`);
        println(`rendering updates meanwhile: ${updates <= 1 ? "at most one" : updates}`);
        println(`width is the one composed at currentTime: ${Math.abs(width - (100 + (2000 * time) / 20000)) <= 0.5}`);
        println(`color is the one composed at currentTime: ${Math.abs(blue - (200 * time) / 20000) <= 1}`);
        done();
    });
</script>
