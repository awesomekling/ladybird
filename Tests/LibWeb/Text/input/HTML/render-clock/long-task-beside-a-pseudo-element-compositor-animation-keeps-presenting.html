<!DOCTYPE html>
<style>
    #box {
        width: 100px;
        height: 20px;
        animation: grow 20s linear;
    }
    #box::before {
        content: "";
        display: inline-block;
        width: 10px;
        height: 10px;
        background-color: green;
        animation: turn 2s linear infinite;
    }
    @keyframes grow {
        from {
            width: 100px;
        }
        to {
            width: 2100px;
        }
    }
    @keyframes turn {
        from {
            transform: rotate(0deg);
        }
        to {
            transform: rotate(360deg);
        }
    }
</style>
<div id="box"></div>
<script src="../../include.js"></script>
<script>
    // Under LIBWEB_RENDER_CLOCK_FRAMES, the render clock goes on presenting a width animation while script runs a long
    // task, beside a transform animation of a pseudo-element that the compositor runs: the render clock never ticks that
    // one, so it does not keep the lease from the document.
    asyncTest(async done => {
        const box = document.getElementById("box");
        const enabled = internals.clockFramesEnabled();
        // Not a timing test: the task begins once the main thread lends the arena to the ticks beside it.
        const waitStart = performance.now();
        do
            await new Promise(resolve => setTimeout(resolve, 10));
        while (enabled && !internals.clockLendActive() && performance.now() - waitStart < 5000);

        const countersBefore = internals.getRenderClockCounters();
        // Not a timing test: the task runs until the render side has presented enough frames, however slow the machine.
        const wanted = 5;
        const start = performance.now();
        let presented = 0;
        while (enabled && performance.now() - start < 5000) {
            presented = internals.getRenderClockCounters().ticksPresented - countersBefore.ticksPresented;
            if (presented >= wanted)
                break;
        }
        println(`the pseudo-element's animation runs on the compositor: ${internals.presentedCompositorAnimationCount() === 1}`);
        println(`frames presented during the task: ${!enabled || presented >= wanted}`);
        done();
    });
</script>
