<!DOCTYPE html>
<style>
    #box {
        width: 100px;
        height: 20px;
        animation: grow 20s linear;
    }
    @keyframes grow {
        from {
            width: 100px;
        }
        to {
            width: 2100px;
        }
    }
</style>
<div id="box"></div>
<script src="../../include.js"></script>
<script>
    // The render clock ticks the page's animation while the main thread idles between
    // timers, and an iframe that changes at every timer has rendering updates run beside those ticks. Each of them
    // moves the timeline, and shows the animation at the time it moved it to: every read sees the width composed at
    // the currentTime it reads.
    asyncTest(async done => {
        const frame = document.createElement("iframe");
        await new Promise(resolve => {
            frame.onload = resolve;
            frame.srcdoc = "<p>frame</p>";
            document.body.appendChild(frame);
        });
        const box = document.getElementById("box");
        const animation = box.getAnimations()[0];
        const paragraph = frame.contentDocument.querySelector("p");
        let mismatches = 0;
        for (let i = 0; i < 40; ++i) {
            paragraph.style.color = i % 2 ? "red" : "green";
            await new Promise(resolve => setTimeout(resolve, 10));
            const time = animation.currentTime;
            const width = parseFloat(getComputedStyle(box).width);
            if (Math.abs(width - (100 + (2000 * time) / 20000)) > 0.5)
                ++mismatches;
        }
        println(`mismatches: ${mismatches}`);
        done();
    });
</script>
