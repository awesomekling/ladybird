<!DOCTYPE html>
<style>
    body {
        margin: 0;
    }
    div {
        display: inline-block;
        height: 20px;
        vertical-align: top;
    }
    #box {
        width: 100px;
        animation: grow 20s linear;
    }
    @keyframes grow {
        from {
            width: 100px;
        }
        to {
            width: 2100px;
        }
    }
    #clipper {
        width: 50px;
        overflow: hidden;
    }
    #clipped {
        width: 100px;
        background-color: blue;
    }
</style>
<div id="box"></div><div id="clipper"><div id="clipped"></div></div>
<script src="../../include.js"></script>
<script>
    function nextTask() {
        const { promise, resolve } = Promise.withResolvers();
        const channel = new MessageChannel();
        channel.port1.onmessage = resolve;
        channel.port2.postMessage(null);
        return promise;
    }

    // A frame time past `time`, and not past now: the time a display tick at the next frame carries.
    async function frameTimeAfter(time) {
        while (performance.now() <= time + 1)
            await nextTask();
        return performance.now();
    }

    // Under LIBWEB_RENDER_CLOCK_FRAMES, a render clock tick whose layout moves a box that owns a clip moves the visual
    // contexts, whose copy the compositor has from the main thread's frames: the tick ends its lease, and the main
    // thread shows the frame.
    asyncTest(async done => {
        const box = document.getElementById("box");
        const clipper = document.getElementById("clipper");
        const animation = box.getAnimations()[0];
        const enabled = internals.clockFramesEnabled();
        internals.setManualRenderingOpportunities(true, true);
        await nextTask();
        let frameTime = performance.now();
        for (let i = 0; i < 3; ++i) {
            frameTime = await frameTimeAfter(frameTime);
            internals.injectRenderingOpportunity(frameTime);
            await nextTask();
        }

        const before = internals.getRenderClockCounters().ticksMovingVisualContexts;
        frameTime = await frameTimeAfter(frameTime);
        const taken = await internals.injectClockTick(frameTime);
        println(`the tick moved the clip and needed the main thread: ${!enabled || (taken && internals.getRenderClockCounters().ticksMovingVisualContexts === before + 1)}`);
        frameTime = await frameTimeAfter(frameTime);
        internals.injectRenderingOpportunity(frameTime);
        await nextTask();
        const time = animation.currentTime;
        println(`the clip is where the width at currentTime puts it: ${Math.abs(clipper.getBoundingClientRect().left - (100 + (2000 * time) / 20000)) <= 0.5}`);
        internals.setManualRenderingOpportunities(false);
        done();
    });
</script>
