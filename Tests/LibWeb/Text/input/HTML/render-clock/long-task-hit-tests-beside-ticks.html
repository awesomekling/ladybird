<!DOCTYPE html>
<style>
    body {
        margin: 0;
    }
    #box {
        width: 100px;
        height: 20px;
        animation: grow 20s linear;
    }
    @keyframes grow {
        from {
            width: 100px;
        }
        to {
            width: 2100px;
        }
    }
</style>
<div id="box"></div>
<script src="../../include.js"></script>
<script>
    // Under LIBWEB_RENDER_CLOCK_FRAMES, a long task hit tests its document while the render clock presents frames of it
    // beside the task. The hit test presents a frame at the task's time, and finds what that frame shows: the render
    // clock presents no more frames at its own time beside the task, which would take turns with it on screen, even
    // once a geometry read would lend the arena again.
    asyncTest(async done => {
        const box = document.getElementById("box");
        const enabled = internals.clockFramesEnabled();
        // Not a timing test: the task begins once the main thread lends the arena to the ticks beside it.
        const waitStart = performance.now();
        do
            await new Promise(resolve => setTimeout(resolve, 10));
        while (enabled && !internals.clockLendActive() && performance.now() - waitStart < 10000);

        const countersBefore = internals.getRenderClockCounters();
        // A geometry read lends the arena to the ticks again once it is over.
        const width = box.getBoundingClientRect().width;
        let start = performance.now();
        let presented = 0;
        while (enabled && presented < 1 && performance.now() - start < 10000)
            presented = internals.getRenderClockCounters().ticksPresented - countersBefore.ticksPresented;

        const hits = [document.elementFromPoint(width - 2, 10) === box, document.elementFromPoint(width + 2, 10) !== box];
        box.getBoundingClientRect();
        const countersAtHitTest = internals.getRenderClockCounters();
        // Not a timing test either: the display goes on ticking, and the task waits for ten of its ticks.
        start = performance.now();
        while (enabled && internals.getRenderClockCounters().ticksPosted - countersAtHitTest.ticksPosted < 10 && performance.now() - start < 10000) { }
        const countersAfter = internals.getRenderClockCounters();

        println(`frames presented during the task: ${!enabled || presented >= 1}`);
        println(`hit tests see the task's width: ${hits.every(hit => hit)}`);
        println(`no frames presented after the hit test: ${countersAfter.ticksPresented === countersAtHitTest.ticksPresented}`);
        done();
    });
</script>
