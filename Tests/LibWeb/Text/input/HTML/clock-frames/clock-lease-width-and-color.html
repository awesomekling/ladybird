<!DOCTYPE html>
<style>
    #box {
        width: 100px;
        height: 20px;
        animation: grow 20s linear;
    }
    @keyframes grow {
        from {
            width: 100px;
            background-color: rgb(0, 0, 0);
        }
        to {
            width: 2100px;
            background-color: rgb(0, 0, 200);
        }
    }
</style>
<div id="box"></div>
<script src="../../include.js"></script>
<script>
    // An idle page's width and color animation, which a clock lease ticks. Each read
    // in a task sees the animation at the time the timeline shows: the width and color it composes at currentTime.
    // No animation frame callback runs, which would end the lease.
    asyncTest(async done => {
        const box = document.getElementById("box");
        const animation = box.getAnimations()[0];
        const ticksBefore = internals.clockTicksPresented();
        let mismatches = 0;
        for (let i = 0; i < 8; ++i) {
            await new Promise(resolve => setTimeout(resolve, 40));
            const time = animation.currentTime;
            const width = box.getBoundingClientRect().width;
            const blue = Number(getComputedStyle(box).backgroundColor.match(/\d+/g)[2]);
            const expectedWidth = 100 + (2000 * time) / 20000;
            const expectedBlue = (200 * time) / 20000;
            if (Math.abs(width - expectedWidth) > 0.5 || Math.abs(blue - expectedBlue) > 1) {
                ++mismatches;
                println(`at ${time}: width ${width} (expected ${expectedWidth}), blue ${blue} (expected ${expectedBlue})`);
            }
            if (animation.currentTime !== time)
                println("currentTime moved within a task");
        }
        println(`mismatches: ${mismatches}`);
        // Not a timing test: the lease ticks the animation however long the display takes to tick.
        const waitStart = performance.now();
        while (internals.clockTicksPresented() === ticksBefore && performance.now() - waitStart < 10000)
            await new Promise(resolve => setTimeout(resolve, 10));
        const ticks = internals.clockTicksPresented() - ticksBefore;
        println(`ticked by the clock lease: ${ticks > 0}`);
        done();
    });
</script>
