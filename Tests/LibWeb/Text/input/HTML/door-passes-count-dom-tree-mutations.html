<!DOCTYPE html>
<script src="../include.js"></script>
<div id="list"></div>
<script>
    test(() => {
        internals.resetRenderingSchedulerCounters();
        const before = internals.getRenderingSchedulerCounters().doors["DOM tree mutation"]?.passes ?? 0;
        for (let i = 0; i < 10; i++)
            list.appendChild(document.createElement("span"));
        list.innerHTML = "<b></b><i></i>";
        const after = internals.getRenderingSchedulerCounters().doors["DOM tree mutation"].passes;
        println(`DOM tree mutation door passes: ${after - before}`);
    });
</script>
