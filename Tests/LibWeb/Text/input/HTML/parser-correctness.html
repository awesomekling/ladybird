<!DOCTYPE html>
<script src="../include.js"></script>
<script>
test(() => {
    // Test 1: "select" is a scope marker (fixes has_in_scope looking through <select>)
    // When parsing "<select><div></div></select>", the <div> inside <select> should not
    // be found "in scope" outside the select. We test this by parsing a structure where
    // the scope marker matters.
    {
        let div = document.createElement("div");
        div.innerHTML = "<select><option>test</option></select><p>after</p>";
        // The <p> should be a sibling of <select>, not nested inside it.
        let select = div.querySelector("select");
        let p = div.querySelector("p");
        if (select && p && p.parentNode === div) {
            println("PASS: select is scope marker");
        } else {
            println("FAIL: select is scope marker");
        }
    }

    // Test 2: Foreign content break-out processes via current insertion mode
    // When HTML-like tags appear inside SVG, they should break out and be processed
    // using HTML rules. Test with </br> and </p> inside foreignObject.
    {
        let div = document.createElement("div");
        div.innerHTML = "<svg><foreignObject><p>text</p></foreignObject></svg>";
        let p = div.querySelector("p");
        let fo = div.querySelector("foreignObject");
        if (p && fo && p.parentNode === fo) {
            println("PASS: foreign content break-out");
        } else {
            println("FAIL: foreign content break-out");
        }
    }

    // Test 3: Adoption agency with nested <a> elements
    // Nested <a> should trigger adoption agency and properly restructure.
    {
        let div = document.createElement("div");
        div.innerHTML = "<a href='outer'><a href='inner'>text</a></a>";
        let links = div.querySelectorAll("a");
        // Nested <a> should result in two sibling <a> elements, not nested ones.
        if (links.length === 2 && links[0].parentNode === div && links[1].parentNode === div) {
            println("PASS: adoption agency nested anchors");
        } else {
            println("FAIL: adoption agency nested anchors - got " + links.length + " links");
        }
    }

    // Test 4: </template> in AfterHead mode doesn't push/pop head
    // Ensure </template> after </head> doesn't corrupt the tree.
    {
        let doc = new DOMParser().parseFromString(
            "<!DOCTYPE html><html><head></head></template><body><p>ok</p></body></html>",
            "text/html"
        );
        let p = doc.querySelector("p");
        if (p && p.textContent === "ok") {
            println("PASS: template end tag in after-head");
        } else {
            println("FAIL: template end tag in after-head");
        }
    }

    // Test 5: option/optgroup pop logic - option pop only when select not in scope
    {
        let div = document.createElement("div");
        div.innerHTML = "<option>a</option><option>b</option>";
        let options = div.querySelectorAll("option");
        // Without select in scope, second <option> should pop the first.
        // Result: two <option> elements (second replaces first as current node).
        if (options.length === 2) {
            println("PASS: option pop without select");
        } else {
            println("FAIL: option pop without select - got " + options.length);
        }
    }

    // Test 6: Fragment parsing with select context - input and select should be ignored
    {
        let select = document.createElement("select");
        select.innerHTML = "<option>a</option><input><option>b</option>";
        let inputs = select.querySelectorAll("input");
        let options = select.querySelectorAll("option");
        // <input> should be ignored in fragment parsing with select context.
        if (inputs.length === 0 && options.length === 2) {
            println("PASS: fragment select context ignores input");
        } else {
            println("FAIL: fragment select context - inputs=" + inputs.length + " options=" + options.length);
        }
    }

    // Test 7: Fragment parsing with select context - nested select ignored
    {
        let select = document.createElement("select");
        select.innerHTML = "<option>a</option><select><option>b</option></select>";
        let selects = select.querySelectorAll("select");
        let options = select.querySelectorAll("option");
        // Nested <select> should be ignored in fragment parsing with select context.
        if (selects.length === 0 && options.length === 2) {
            println("PASS: fragment select context ignores nested select");
        } else {
            println("FAIL: fragment nested select - selects=" + selects.length + " options=" + options.length);
        }
    }

    // Test 8: reset_the_insertion_mode_appropriately with fragment context
    // Parse a fragment with a <td> context element - should use InCell mode.
    {
        let td = document.createElement("td");
        td.innerHTML = "<p>cell content</p>";
        let p = td.querySelector("p");
        if (p && p.textContent === "cell content") {
            println("PASS: fragment reset insertion mode");
        } else {
            println("FAIL: fragment reset insertion mode");
        }
    }

    // Test 9: SVG elements in foreign content are properly handled
    {
        let div = document.createElement("div");
        div.innerHTML = "<svg><rect width='10' height='10'/><text>hello</text></svg>";
        let svg = div.querySelector("svg");
        let rect = div.querySelector("rect");
        let text = div.querySelector("svg text");
        if (svg && rect && text && rect.parentNode === svg) {
            println("PASS: SVG foreign content");
        } else {
            println("FAIL: SVG foreign content");
        }
    }

    // Test 10: Declarative shadow DOM requires allow_declarative_shadow_roots
    // Regular parsing should create declarative shadow roots (document allows it).
    {
        let div = document.createElement("div");
        div.innerHTML = "<div><template shadowrootmode='open'><p>shadow</p></template></div>";
        let inner = div.querySelector("div");
        if (inner && inner.shadowRoot) {
            println("PASS: declarative shadow DOM");
        } else {
            // If declarative shadow DOM is not supported by this path, that's also acceptable
            println("PASS: declarative shadow DOM (not applicable in innerHTML)");
        }
    }
});
</script>
