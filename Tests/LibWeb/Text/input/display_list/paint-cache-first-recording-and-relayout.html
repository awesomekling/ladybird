<!doctype html>
<html id="html">
<script src="../include.js"></script>
<script src="recording-test.js"></script>
<style>
    body { margin: 0; font: 16px/20px monospace; }
    .card { display: flow-root; margin: 0 0 4px; padding: 4px; border: 1px solid #ccc; }
</style>
<body id="body">
<div id="root"></div>
<script>
displayListTest({
    setup: () => {
        removeBodyWhitespace();
        for (let i = 0; i < 2; ++i) {
            const card = document.createElement("div");
            card.id = `card${i}`;
            card.className = "card";
            card.textContent = `Card ${i}`;
            root.appendChild(card);
        }
    },
    steps: [
        {
            name: "cold recording",
            cold: true,
            expect: `
                damage: rows=0 moved=0 order=0 eligibility=0 all=true
                @canvas RECORD (empty)
                @viewport RECORD
                  @viewport/preamble RECORD (empty)
                  @viewport/background/hit-test RECORD
                  @viewport/scroll-metadata RECORD (empty)
                  @viewport/background SKIP
                  @viewport/border SKIP
                  BlockContainer<HTML>#html/descendants(background-and-borders) RECORD
                  @viewport/foreground/hit-test RECORD (empty)
                  @viewport/foreground RECORD (empty)
                  BlockContainer<HTML>#html/descendants(foreground) RECORD
                  BlockContainer<HTML>#html RECORD
                    BlockContainer<HTML>#html/preamble RECORD (empty)
                    BlockContainer<HTML>#html/background/hit-test RECORD
                    BlockContainer<HTML>#html/scroll-metadata RECORD (empty)
                    BlockContainer<HTML>#html/background RECORD (empty)
                    BlockContainer<HTML>#html/border SKIP
                    BlockContainer<BODY>#body/descendants(background-and-borders) RECORD
                      BlockContainer<BODY>#body/background/hit-test RECORD
                      BlockContainer<BODY>#body/scroll-metadata RECORD (empty)
                      BlockContainer<BODY>#body/background SKIP
                      BlockContainer<BODY>#body/border SKIP
                      BlockContainer<DIV>#root/descendants(background-and-borders) RECORD
                        BlockContainer<DIV>#root/background/hit-test RECORD
                        BlockContainer<DIV>#root/scroll-metadata RECORD (empty)
                        BlockContainer<DIV>#root/background SKIP
                        BlockContainer<DIV>#root/border SKIP
                        BlockContainer<DIV>#card0.card/descendants(background-and-borders) RECORD
                          BlockContainer<DIV>#card0.card/background/hit-test RECORD
                          BlockContainer<DIV>#card0.card/scroll-metadata RECORD (empty)
                          BlockContainer<DIV>#card0.card/background SKIP
                          BlockContainer<DIV>#card0.card/border RECORD
                        BlockContainer<DIV>#card1.card/descendants(background-and-borders) RECORD
                          BlockContainer<DIV>#card1.card/background/hit-test RECORD
                          BlockContainer<DIV>#card1.card/scroll-metadata RECORD (empty)
                          BlockContainer<DIV>#card1.card/background SKIP
                          BlockContainer<DIV>#card1.card/border RECORD
                    BlockContainer<HTML>#html/foreground/hit-test RECORD (empty)
                    BlockContainer<HTML>#html/foreground RECORD (empty)
                    BlockContainer<BODY>#body/descendants(foreground) RECORD
                      BlockContainer<BODY>#body/foreground/hit-test RECORD (empty)
                      BlockContainer<BODY>#body/foreground RECORD (empty)
                      BlockContainer<DIV>#root/descendants(foreground) RECORD
                        BlockContainer<DIV>#root/foreground/hit-test RECORD (empty)
                        BlockContainer<DIV>#root/foreground RECORD (empty)
                        BlockContainer<DIV>#card0.card/descendants(foreground) RECORD
                          BlockContainer<DIV>#card0.card/foreground/hit-test RECORD
                          BlockContainer<DIV>#card0.card/foreground RECORD
                          BlockContainer<DIV>#card0.card/outline SKIP
                          BlockContainer<DIV>#card0.card/overlay/hit-test RECORD (empty)
                          BlockContainer<DIV>#card0.card/overlay SKIP
                        BlockContainer<DIV>#card1.card/descendants(foreground) RECORD
                          BlockContainer<DIV>#card1.card/foreground/hit-test RECORD
                          BlockContainer<DIV>#card1.card/foreground RECORD
                          BlockContainer<DIV>#card1.card/outline SKIP
                          BlockContainer<DIV>#card1.card/overlay/hit-test RECORD (empty)
                          BlockContainer<DIV>#card1.card/overlay SKIP
                        BlockContainer<DIV>#root/outline SKIP
                        BlockContainer<DIV>#root/overlay/hit-test RECORD (empty)
                        BlockContainer<DIV>#root/overlay SKIP
                      BlockContainer<BODY>#body/outline SKIP
                      BlockContainer<BODY>#body/overlay/hit-test RECORD (empty)
                      BlockContainer<BODY>#body/overlay SKIP
                    BlockContainer<HTML>#html/outline SKIP
                  @viewport/outline SKIP
            `
        },
        {
            name: "relayout one card",
            mutate: () => { card1.firstChild.data = "Edited"; },
            expect: `
                damage: rows=5 moved=0 order=0 eligibility=0 all=false
                @canvas RECORD (empty)
                @viewport ASSEMBLE
                  @viewport/preamble COPY
                  @viewport/background/hit-test COPY
                  @viewport/scroll-metadata COPY
                  BlockContainer<HTML>#html/descendants(background-and-borders) ASSEMBLE
                  BlockContainer<HTML>#html/descendants(foreground) ASSEMBLE
                  BlockContainer<HTML>#html ASSEMBLE
                    BlockContainer<HTML>#html/preamble COPY
                    BlockContainer<HTML>#html/background/hit-test COPY
                    BlockContainer<HTML>#html/scroll-metadata COPY
                    BlockContainer<BODY>#body/descendants(background-and-borders) ASSEMBLE
                      BlockContainer<BODY>#body/background/hit-test COPY
                      BlockContainer<BODY>#body/scroll-metadata COPY
                      BlockContainer<DIV>#root/descendants(background-and-borders) ASSEMBLE
                        BlockContainer<DIV>#root/background/hit-test COPY
                        BlockContainer<DIV>#root/scroll-metadata COPY
                        BlockContainer<DIV>#card0.card/descendants(background-and-borders) COPY
                        BlockContainer<DIV>#card1.card/descendants(background-and-borders) REPLAN
                          BlockContainer<DIV>#card1.card/background/hit-test RECORD
                          BlockContainer<DIV>#card1.card/scroll-metadata RECORD (empty)
                          BlockContainer<DIV>#card1.card/background SKIP
                          BlockContainer<DIV>#card1.card/border RECORD
                    BlockContainer<BODY>#body/descendants(foreground) ASSEMBLE
                      BlockContainer<DIV>#root/descendants(foreground) ASSEMBLE
                        BlockContainer<DIV>#card0.card/descendants(foreground) COPY
                        BlockContainer<DIV>#card1.card/descendants(foreground) REPLAN
                          BlockContainer<DIV>#card1.card/foreground/hit-test RECORD
                          BlockContainer<DIV>#card1.card/foreground RECORD
                          BlockContainer<DIV>#card1.card/outline SKIP
                          BlockContainer<DIV>#card1.card/overlay/hit-test RECORD (empty)
                          BlockContainer<DIV>#card1.card/overlay SKIP
            `
        }
    ]
});
</script>
