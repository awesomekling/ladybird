<!doctype html>
<html id="html">
<script src="../include.js"></script>
<script src="recording-test.js"></script>
<style>
    body { margin: 0; font: 16px/20px monospace; }
    #a, #b { position: relative; width: 200px; }
    .row { padding: 2px; border-bottom: 1px solid #ccc; }
</style>
<body id="body">
<div id="a"><div class="row" id="a0">A 0</div></div>
<div id="b"></div>
<script>
displayListTest({
    setup: () => {
        removeBodyWhitespace();
        for (let i = 0; i < 2; ++i) {
            const row = document.createElement("div");
            row.id = `b${i}`;
            row.className = "row";
            row.textContent = `B ${i}`;
            b.appendChild(row);
        }
    },
    steps: [
        {
            name: "first interior change",
            mutate: () => { b0.style.color = "red"; },
            expect: `
                damage: rows=5 moved=0 order=0 eligibility=0 all=false
                @canvas RECORD (empty)
                @viewport ASSEMBLE
                  @viewport/preamble COPY
                  @viewport/background/hit-test COPY
                  @viewport/scroll-metadata COPY
                  BlockContainer<HTML>#html/descendants(background-and-borders) ASSEMBLE
                  BlockContainer<HTML>#html/descendants(foreground) ASSEMBLE
                  BlockContainer<HTML>#html ASSEMBLE
                    BlockContainer<HTML>#html/preamble COPY
                    BlockContainer<HTML>#html/background/hit-test COPY
                    BlockContainer<HTML>#html/scroll-metadata COPY
                    BlockContainer<BODY>#body/descendants(background-and-borders) ASSEMBLE
                      BlockContainer<BODY>#body/background/hit-test COPY
                      BlockContainer<BODY>#body/scroll-metadata COPY
                      BlockContainer<DIV>#a/descendants(background-and-borders) COPY
                      BlockContainer<DIV>#b/descendants(background-and-borders) ASSEMBLE
                    BlockContainer<BODY>#body/descendants(foreground) ASSEMBLE
                      BlockContainer<DIV>#a/descendants(foreground) COPY
                      BlockContainer<DIV>#b/descendants(foreground) ASSEMBLE
                    BlockContainer<DIV>#a COPY
                    BlockContainer<DIV>#b ASSEMBLE
                      BlockContainer<DIV>#b/background/hit-test COPY
                      BlockContainer<DIV>#b/scroll-metadata COPY
                      BlockContainer<DIV>#b/background COPY
                      BlockContainer<DIV>#b/border COPY
                      BlockContainer<DIV>#b0.row/descendants(background-and-borders) REPLAN
                        BlockContainer<DIV>#b0.row/background/hit-test COPY
                        BlockContainer<DIV>#b0.row/scroll-metadata COPY
                        BlockContainer<DIV>#b0.row/background SKIP
                        BlockContainer<DIV>#b0.row/border RECORD
                      BlockContainer<DIV>#b1.row/descendants(background-and-borders) COPY
                      BlockContainer<DIV>#b0.row/descendants(floats) ASSEMBLE
                      BlockContainer<DIV>#b1.row/descendants(floats) COPY
                      BlockContainer<DIV>#b0.row/descendants(inline-background-and-borders) ASSEMBLE
                      BlockContainer<DIV>#b1.row/descendants(inline-background-and-borders) COPY
                      BlockContainer<DIV>#b/foreground/hit-test COPY
                      BlockContainer<DIV>#b/foreground COPY
                      BlockContainer<DIV>#b0.row/descendants(foreground) REPLAN
                        BlockContainer<DIV>#b0.row/foreground/hit-test COPY
                        BlockContainer<DIV>#b0.row/foreground RECORD
                        BlockContainer<DIV>#b0.row/outline SKIP
                        BlockContainer<DIV>#b0.row/overlay/hit-test RECORD (empty)
                        BlockContainer<DIV>#b0.row/overlay SKIP
                      BlockContainer<DIV>#b1.row/descendants(foreground) COPY
                      BlockContainer<DIV>#b/outline COPY
                      BlockContainer<DIV>#b/overlay/hit-test COPY
                      BlockContainer<DIV>#b/overlay COPY
            `
        },
        {
            name: "first quiet recording",
            expect: `
                damage: rows=0 moved=0 order=0 eligibility=0 all=false
                @canvas RECORD (empty)
                @viewport COPY
            `
        },
        {
            name: "second quiet recording",
            expect: `
                damage: rows=0 moved=0 order=0 eligibility=0 all=false
                @canvas RECORD (empty)
                @viewport COPY
            `
        },
        {
            name: "second interior change",
            mutate: () => { b0.style.color = "blue"; },
            expect: `
                damage: rows=5 moved=0 order=0 eligibility=0 all=false
                @canvas RECORD (empty)
                @viewport ASSEMBLE
                  @viewport/preamble COPY
                  @viewport/background/hit-test COPY
                  @viewport/scroll-metadata COPY
                  BlockContainer<HTML>#html/descendants(background-and-borders) ASSEMBLE
                  BlockContainer<HTML>#html/descendants(foreground) ASSEMBLE
                  BlockContainer<HTML>#html ASSEMBLE
                    BlockContainer<HTML>#html/preamble COPY
                    BlockContainer<HTML>#html/background/hit-test COPY
                    BlockContainer<HTML>#html/scroll-metadata COPY
                    BlockContainer<BODY>#body/descendants(background-and-borders) ASSEMBLE
                      BlockContainer<BODY>#body/background/hit-test COPY
                      BlockContainer<BODY>#body/scroll-metadata COPY
                      BlockContainer<DIV>#a/descendants(background-and-borders) COPY
                      BlockContainer<DIV>#b/descendants(background-and-borders) ASSEMBLE
                    BlockContainer<BODY>#body/descendants(foreground) ASSEMBLE
                      BlockContainer<DIV>#a/descendants(foreground) COPY
                      BlockContainer<DIV>#b/descendants(foreground) ASSEMBLE
                    BlockContainer<DIV>#a COPY
                    BlockContainer<DIV>#b ASSEMBLE
                      BlockContainer<DIV>#b/background/hit-test COPY
                      BlockContainer<DIV>#b/scroll-metadata COPY
                      BlockContainer<DIV>#b/background COPY
                      BlockContainer<DIV>#b/border COPY
                      BlockContainer<DIV>#b0.row/descendants(background-and-borders) REPLAN
                        BlockContainer<DIV>#b0.row/background/hit-test COPY
                        BlockContainer<DIV>#b0.row/scroll-metadata COPY
                        BlockContainer<DIV>#b0.row/background SKIP
                        BlockContainer<DIV>#b0.row/border RECORD
                      BlockContainer<DIV>#b1.row/descendants(background-and-borders) COPY
                      BlockContainer<DIV>#b0.row/descendants(floats) ASSEMBLE
                      BlockContainer<DIV>#b1.row/descendants(floats) COPY
                      BlockContainer<DIV>#b0.row/descendants(inline-background-and-borders) ASSEMBLE
                      BlockContainer<DIV>#b1.row/descendants(inline-background-and-borders) COPY
                      BlockContainer<DIV>#b/foreground/hit-test COPY
                      BlockContainer<DIV>#b/foreground COPY
                      BlockContainer<DIV>#b0.row/descendants(foreground) REPLAN
                        BlockContainer<DIV>#b0.row/foreground/hit-test COPY
                        BlockContainer<DIV>#b0.row/foreground RECORD
                        BlockContainer<DIV>#b0.row/outline SKIP
                        BlockContainer<DIV>#b0.row/overlay/hit-test RECORD (empty)
                        BlockContainer<DIV>#b0.row/overlay SKIP
                      BlockContainer<DIV>#b1.row/descendants(foreground) COPY
                      BlockContainer<DIV>#b/outline COPY
                      BlockContainer<DIV>#b/overlay/hit-test COPY
                      BlockContainer<DIV>#b/overlay COPY
            `
        }
    ]
});
</script>
