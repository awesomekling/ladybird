<!doctype html>
<html id="html">
<script src="../include.js"></script>
<script src="recording-test.js"></script>
<style>
    body { margin: 0; font: 16px/20px monospace; }
    #first, #second { position: relative; width: 200px; }
</style>
<body id="body">
<div id="first"></div>
<div id="second"></div>
<script>
displayListTest({
    setup: () => {
        removeBodyWhitespace();
        first.attachShadow({ mode: "open" }).innerHTML =
            '<style>#item::before { content: "pseudo"; display: block; background: lime; }</style>' +
            'anonymous before<div id="item">first</div>anonymous after';
        second.attachShadow({ mode: "open" }).innerHTML = '<div id="item">second</div>';
    },
    steps: [
        {
            name: "change one shadow owner with a pseudo-element",
            mutate: () => { first.shadowRoot.getElementById("item").style.color = "red"; },
            expect: `
                damage: rows=7 moved=0 order=0 eligibility=0 all=false
                @canvas RECORD (empty)
                @viewport ASSEMBLE
                  @viewport/preamble COPY
                  @viewport/background/hit-test COPY
                  @viewport/scroll-metadata COPY
                  BlockContainer<HTML>#html/descendants(background-and-borders) ASSEMBLE
                  BlockContainer<HTML>#html/descendants(foreground) ASSEMBLE
                  BlockContainer<HTML>#html ASSEMBLE
                    BlockContainer<HTML>#html/preamble COPY
                    BlockContainer<HTML>#html/background/hit-test COPY
                    BlockContainer<HTML>#html/scroll-metadata COPY
                    BlockContainer<BODY>#body/descendants(background-and-borders) ASSEMBLE
                      BlockContainer<BODY>#body/background/hit-test COPY
                      BlockContainer<BODY>#body/scroll-metadata COPY
                      BlockContainer<DIV>#first/descendants(background-and-borders) ASSEMBLE
                      BlockContainer<DIV>#second/descendants(background-and-borders) COPY
                    BlockContainer<BODY>#body/descendants(foreground) ASSEMBLE
                      BlockContainer<DIV>#first/descendants(foreground) ASSEMBLE
                      BlockContainer<DIV>#second/descendants(foreground) COPY
                    BlockContainer<DIV>#first ASSEMBLE
                      BlockContainer<DIV>#first/background/hit-test COPY
                      BlockContainer<DIV>#first/scroll-metadata COPY
                      BlockContainer<DIV>#first/background COPY
                      BlockContainer<DIV>#first/border COPY
                      BlockContainer(anonymous)/descendants(background-and-borders) COPY
                      BlockContainer<DIV>#item/descendants(background-and-borders) REPLAN
                        BlockContainer<DIV>#item/background/hit-test COPY
                        BlockContainer<DIV>#item/scroll-metadata COPY
                        BlockContainer<DIV>#item/background SKIP
                        BlockContainer<DIV>#item/border SKIP
                        BlockContainer(anonymous)/descendants(background-and-borders) REPLAN
                          BlockContainer(anonymous)/background/hit-test COPY
                          BlockContainer(anonymous)/scroll-metadata COPY
                          BlockContainer(anonymous)/background RECORD
                          BlockContainer(anonymous)/border SKIP
                        BlockContainer(anonymous)/descendants(background-and-borders) REPLAN
                          BlockContainer(anonymous)/background/hit-test RECORD (empty)
                          BlockContainer(anonymous)/scroll-metadata COPY
                          BlockContainer(anonymous)/background SKIP
                          BlockContainer(anonymous)/border SKIP
                      BlockContainer(anonymous)/descendants(background-and-borders) COPY
                      BlockContainer(anonymous)/descendants(floats) COPY
                      BlockContainer<DIV>#item/descendants(floats) ASSEMBLE
                        BlockContainer(anonymous)/descendants(floats) ASSEMBLE
                        BlockContainer(anonymous)/descendants(floats) ASSEMBLE
                      BlockContainer(anonymous)/descendants(floats) COPY
                      BlockContainer(anonymous)/descendants(inline-background-and-borders) COPY
                      BlockContainer<DIV>#item/descendants(inline-background-and-borders) ASSEMBLE
                        BlockContainer(anonymous)/descendants(inline-background-and-borders) ASSEMBLE
                        BlockContainer(anonymous)/descendants(inline-background-and-borders) ASSEMBLE
                      BlockContainer(anonymous)/descendants(inline-background-and-borders) COPY
                      BlockContainer<DIV>#first/foreground/hit-test COPY
                      BlockContainer<DIV>#first/foreground COPY
                      BlockContainer(anonymous)/descendants(foreground) COPY
                      BlockContainer<DIV>#item/descendants(foreground) REPLAN
                        BlockContainer<DIV>#item/foreground/hit-test RECORD (empty)
                        BlockContainer<DIV>#item/foreground RECORD (empty)
                        BlockContainer(anonymous)/descendants(foreground) REPLAN
                          BlockContainer(anonymous)/foreground/hit-test COPY
                          BlockContainer(anonymous)/foreground RECORD
                          BlockContainer(anonymous)/outline SKIP
                          BlockContainer(anonymous)/overlay/hit-test RECORD (empty)
                          BlockContainer(anonymous)/overlay SKIP
                        BlockContainer(anonymous)/descendants(foreground) REPLAN
                          BlockContainer(anonymous)/foreground/hit-test COPY
                          BlockContainer(anonymous)/foreground RECORD
                          BlockContainer(anonymous)/outline SKIP
                          BlockContainer(anonymous)/overlay/hit-test RECORD (empty)
                          BlockContainer(anonymous)/overlay SKIP
                        BlockContainer<DIV>#item/outline SKIP
                        BlockContainer<DIV>#item/overlay/hit-test RECORD (empty)
                        BlockContainer<DIV>#item/overlay SKIP
                      BlockContainer(anonymous)/descendants(foreground) COPY
                      BlockContainer<DIV>#first/outline COPY
                      BlockContainer<DIV>#first/overlay/hit-test COPY
                      BlockContainer<DIV>#first/overlay COPY
                    BlockContainer<DIV>#second COPY
            `,
        },
        {
            name: "quiet shadow trees",
            expect: `
                damage: rows=0 moved=0 order=0 eligibility=0 all=false
                @canvas RECORD (empty)
                @viewport COPY
            `,
        },
    ],
});
</script>
