<!doctype html>
<script src="../include.js"></script>
<style>
    body { margin: 0; font: 20px SerenitySans, sans-serif; }
    div { position: absolute; left: 0; width: 100px; height: 100px; }
    #host { top: 0; }
    #inert-host { top: 100px; }
    area { cursor: auto; }
    img { background: silver; }
</style>
<div id="host">
    <map name="shapes"><area shape="rect" coords="0,0,60,60" href="#"></map>
    <img usemap="#shapes" width="100" height="100">
</div>
<div id="inert-host">
    <map name="inert-shapes"><area shape="rect" coords="0,0,60,60" href="#"></map>
    <img usemap="#inert-shapes" width="100" height="100">
</div>
<script>
    // An <area> is never rendered, so whether it is editable rides on the areas its image
    // publishes. Neither contenteditable nor inert touches the map or the image, so both are
    // checked here: the cursor over the area answers IBeam only while the area is editable.
    test(() => {
        const host = document.getElementById("host");
        const inertHost = document.getElementById("inert-host");
        const report = label => {
            internals.mouseMove(20, 20);
            println(`${label}: ${internals.currentCursor()}`);
        };
        const reportInert = label => {
            internals.mouseMove(20, 120);
            println(`${label}: ${internals.currentCursor()}`);
        };

        report("before the ancestor is editable");
        host.contentEditable = "true";
        report("while the ancestor is editable");
        host.contentEditable = "false";
        report("after the ancestor stops being editable");
        host.removeAttribute("contenteditable");
        report("after the attribute is gone");

        inertHost.contentEditable = "true";
        reportInert("editable and not inert");
        inertHost.inert = true;
        reportInert("editable but inert");
        inertHost.inert = false;
        reportInert("editable and not inert again");
    });
</script>
