<!doctype html>
<script src="../include.js"></script>
<style>
    body { margin: 0; font: 20px SerenitySans, sans-serif; }
    div { position: absolute; left: 0; width: 100px; height: 100px; }
    #link-box { top: 0; }
    #editable { top: 100px; cursor: auto; }
    #mapped { top: 200px; }
    #mapped-editable { top: 300px; }
    #disabled-box { top: 400px; }
    #framed { top: 500px; }
    #unselectable { top: 600px; cursor: auto; user-select: none; }
    area { cursor: crosshair; }
    iframe { width: 100px; height: 100px; border: none; }
</style>
<div id="link-box"><a href="#" style="display: block; height: 100px">link</a></div>
<div id="editable" contenteditable>editable text</div>
<div id="mapped">
    <map name="shapes"><area shape="rect" coords="0,0,60,60" href="#"></map>
    <img usemap="#shapes" width="100" height="100" style="background: silver">
</div>
<div id="mapped-editable" contenteditable>
    <map name="editable-shapes"><area shape="rect" coords="0,0,60,60" href="#"></map>
    <img usemap="#editable-shapes" width="100" height="100" style="background: silver">
</div>
<div id="disabled-box"><input type="button" value="off" disabled style="width: 100px; height: 100px"></div>
<div id="framed"><iframe srcdoc="<style>body{margin:0}</style><div style='width:100px;height:100px;cursor:progress'></div>"></iframe></div>
<div id="unselectable">unselectable text</div>
<script>
    asyncTest(async done => {
        const report = (label, x, y) => {
            internals.mouseMove(x, y);
            println(`${label}: ${internals.currentCursor()}`);
        };

        // An iframe's own document decides the cursor over it, so wait for it to be there.
        await new Promise(resolve => {
            const frame = document.querySelector("iframe");
            if (frame.contentDocument && frame.contentDocument.readyState === "complete")
                resolve();
            else
                frame.onload = () => resolve();
        });

        // The nested navigable answers for a hit over it only once its own rendering has run.
        const frameWindow = document.querySelector("iframe").contentWindow;
        await new Promise(resolve => frameWindow.requestAnimationFrame(() => frameWindow.requestAnimationFrame(resolve)));
        await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));

        report("over a link", 50, 50);
        report("over editable text", 50, 150);
        report("over an image map's area", 20, 220);
        report("over the image beside the area", 80, 280);
        report("over an area inside editable content", 20, 320);
        report("over a disabled button", 50, 450);
        report("over a nested navigable", 50, 550);
        report("over unselectable text", 50, 650);

        done();
    });
</script>
